name: Install Private Batch 011

on:
  push:
    branches:
      - "research/usmle-step1-2026-original-qbank"
    paths:
      - ".github/workflows/install-batch011.yml"
      - ".tmp/batch011/**"
      - ".tmp/batch011v2/**"

permissions:
  contents: write

concurrency:
  group: install-private-batch-011
  cancel-in-progress: false

jobs:
  install-validate-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/usmle-step1-2026-original-qbank
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reconstruct, validate, commit, and clean Batch 011
        shell: bash
        run: |
          set -euo pipefail

          # A follow-up push that removes this workflow may still enqueue one
          # final run from the previous revision. Exit safely when the payload
          # is already gone.
          if [[ ! -d .tmp/batch011v2 ]]; then
            echo "Batch 011 transfer payload already removed; nothing to do."
            exit 0
          fi

          cat .tmp/batch011v2/part-* > /tmp/batch011.tar.gz.b64
          test "$(wc -c < /tmp/batch011.tar.gz.b64)" -eq 33792
          base64 -d /tmp/batch011.tar.gz.b64 > /tmp/batch011.tar.gz
          echo "a7098e1eb5bb39675f2685f021d92251c7af23fcf24501fa84059bd5c81476c6  /tmp/batch011.tar.gz" | sha256sum -c -

          tar -xzf /tmp/batch011.tar.gz

          test -f research/usmle-step1-2026/drafts/batch-011-in-chat-original-20.json
          test -f research/usmle-step1-2026/coverage/batch-011-in-chat-original-20-matrix.json
          test -f research/usmle-step1-2026/audits/batch-011-in-chat-originality-audit.json
          test "$(find research/usmle-step1-2026/media -maxdepth 1 -type f -name '*.svg' | grep -E '/(uip-honeycomb-fibroblastic-foci|infantile-hemangioma-growth-glut1|hpv-oropharynx-e6-e7-p16|posterior-urethral-valves-keyhole|allergic-contact-dermatitis-hapten|melanoma-breslow-depth|fanconi-proximal-solute-wasting|osteosarcoma-sunburst-osteoid|ebv-cd21-reactive-cd8|kaposi-hhv8-spindle-slits|osteoarthritis-joint-space-osteophyte|actinic-keratosis-lower-epidermis|scabies-burrow-mite-eggs|obstructive-atelectasis-shift-toward|keloid-vs-hypertrophic-boundary|brachial-plexus-upper-trunk-erb|alpha1-antitrypsin-lung-liver|crohn-enteric-hyperoxaluria|pituitary-macroadenoma-chiasm|acute-pancreatitis-saponification)\.svg$' | wc -l)" -eq 20

          node scripts/validate-usmle-research-drafts.mjs
          node scripts/validate-usmle-answer-positions.mjs

          git config user.name "nextgeninstitute857-bot"
          git config user.email "nextgeninstitute857-bot@users.noreply.github.com"

          git add \
            research/usmle-step1-2026/drafts/batch-011-in-chat-original-20.json \
            research/usmle-step1-2026/coverage/batch-011-in-chat-original-20-matrix.json \
            research/usmle-step1-2026/audits/batch-011-in-chat-originality-audit.json \
            research/usmle-step1-2026/media/uip-honeycomb-fibroblastic-foci.svg \
            research/usmle-step1-2026/media/infantile-hemangioma-growth-glut1.svg \
            research/usmle-step1-2026/media/hpv-oropharynx-e6-e7-p16.svg \
            research/usmle-step1-2026/media/posterior-urethral-valves-keyhole.svg \
            research/usmle-step1-2026/media/allergic-contact-dermatitis-hapten.svg \
            research/usmle-step1-2026/media/melanoma-breslow-depth.svg \
            research/usmle-step1-2026/media/fanconi-proximal-solute-wasting.svg \
            research/usmle-step1-2026/media/osteosarcoma-sunburst-osteoid.svg \
            research/usmle-step1-2026/media/ebv-cd21-reactive-cd8.svg \
            research/usmle-step1-2026/media/kaposi-hhv8-spindle-slits.svg \
            research/usmle-step1-2026/media/osteoarthritis-joint-space-osteophyte.svg \
            research/usmle-step1-2026/media/actinic-keratosis-lower-epidermis.svg \
            research/usmle-step1-2026/media/scabies-burrow-mite-eggs.svg \
            research/usmle-step1-2026/media/obstructive-atelectasis-shift-toward.svg \
            research/usmle-step1-2026/media/keloid-vs-hypertrophic-boundary.svg \
            research/usmle-step1-2026/media/brachial-plexus-upper-trunk-erb.svg \
            research/usmle-step1-2026/media/alpha1-antitrypsin-lung-liver.svg \
            research/usmle-step1-2026/media/crohn-enteric-hyperoxaluria.svg \
            research/usmle-step1-2026/media/pituitary-macroadenoma-chiasm.svg \
            research/usmle-step1-2026/media/acute-pancreatitis-saponification.svg

          git rm -r .tmp/batch011 .tmp/batch011v2 .github/workflows/install-batch011.yml
          git commit -m "Add original ZIP-driven Batch 011 twenty-question set"
          git push origin HEAD:research/usmle-step1-2026-original-qbank

# This workflow touches only the permanent private research branch. It has no
# merge, deployment, live QBank import, student exposure, or publication step.
