name: Apply QBank export exam-track hotfix

on:
  push:
    branches:
      - hotfix/qbank-export-exam-track

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix/qbank-export-exam-track
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact source and regression-test fix
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const serverPath = 'server.js';
          const testPath = 'test/content-taxonomy-control.test.js';
          const workflowPath = '.github/workflows/apply-qbank-export-exam-track-hotfix.yml';

          let server = fs.readFileSync(serverPath, 'utf8');
          const routePattern = /(async function aylaNoCreditMcqExportPage\(\{ examTrack, offset = 0, limit = 5 \} = \{\}\) \{\r?\n  const examTrackId = )normalizeAylaRegistryExamTrack(\(examTrack\);)/g;
          const matches = [...server.matchAll(routePattern)];
          if (matches.length !== 1) {
            throw new Error(`Expected exactly one no-credit export registry lookup, found ${matches.length}`);
          }
          server = server.replace(routePattern, '$1normalizeAylaShellExamTrack$2');
          fs.writeFileSync(serverPath, server);

          let testSource = fs.readFileSync(testPath, 'utf8');
          const testName = 'no-credit taxonomy export uses the internal AylaMed exam key for registry lookup';
          if (!testSource.includes(testName)) {
            testSource += `\n\ntest("${testName}", () => {\n  const server = fs.readFileSync(new URL("../server.js", import.meta.url), "utf8");\n  const start = server.indexOf("async function aylaNoCreditMcqExportPage");\n  const end = server.indexOf('app.get("/api/ayla/admin/resources/content-taxonomy/no-credit-export"');\n  assert.ok(start >= 0 && end > start, "the bounded no-credit export helper must be present");\n  const exportHelper = server.slice(start, end);\n  assert.match(exportHelper, /const examTrackId = normalizeAylaShellExamTrack\\(examTrack\\)/);\n  assert.doesNotMatch(exportHelper, /const examTrackId = normalizeAylaRegistryExamTrack\\(examTrack\\)/);\n});\n`;
            fs.writeFileSync(testPath, testSource);
          }

          fs.rmSync(workflowPath);
          NODE

      - name: Validate backend syntax and focused taxonomy tests
        run: |
          node --check server.js
          node --test test/content-taxonomy-control.test.js

      - name: Commit the validated hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix QBank export exam-track registry lookup"
          git push origin HEAD:hotfix/qbank-export-exam-track
