name: Validate USMLE Research Drafts

on:
  pull_request:
    paths:
      - "research/usmle-step1-2026/**"
      - "scripts/validate-usmle-research-drafts.mjs"
      - "scripts/validate-usmle-answer-positions.mjs"
      - "scripts/lib/answer-order-policy.mjs"
      - ".github/workflows/validate-usmle-research.yml"
  push:
    branches:
      - "research/usmle-step1-2026-original-qbank"
    paths:
      - "research/usmle-step1-2026/**"
      - "scripts/validate-usmle-research-drafts.mjs"
      - "scripts/validate-usmle-answer-positions.mjs"
      - "scripts/lib/answer-order-policy.mjs"
      - ".github/workflows/validate-usmle-research.yml"

permissions:
  contents: write

jobs:
  validate-private-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JSON, taxonomy, review gates, and original media
        run: node scripts/validate-usmle-research-drafts.mjs
      - name: Validate authored balance and student answer shuffling
        run: node scripts/validate-usmle-answer-positions.mjs

  export-committed-stems-once:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'research/usmle-step1-2026-original-qbank'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: export-private-batch-012-013-stems
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/usmle-step1-2026-original-qbank
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Revalidate before export
        run: |
          node scripts/validate-usmle-research-drafts.mjs
          node scripts/validate-usmle-answer-positions.mjs
      - name: Export exact committed Batch 012-013 stems
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const drafts = path.join('research', 'usmle-step1-2026', 'drafts');
          const files = fs.readdirSync(drafts)
            .filter((name) => /^batch-01[23]-.*\.json$/.test(name))
            .sort();
          const rows = ['draft_id\tbatch_file\tstem_html_json'];
          for (const file of files) {
            const batch = JSON.parse(fs.readFileSync(path.join(drafts, file), 'utf8'));
            for (const question of batch.questions || []) {
              rows.push(`${question.draft_id}\t${file}\t${JSON.stringify(question.stem_html)}`);
            }
          }
          if (rows.length !== 41) {
            throw new Error(`Expected 40 committed stems, found ${rows.length - 1}`);
          }
          const output = path.join('research', 'usmle-step1-2026', 'audits', 'batch-012-013-committed-stems.tsv');
          fs.writeFileSync(output, `${rows.join('\n')}\n`, 'utf8');
          console.log(JSON.stringify({ files: files.length, stems: rows.length - 1, output }));
          NODE
      - name: Restore read-only validator and commit audit input
        shell: bash
        run: |
          cat > .github/workflows/validate-usmle-research.yml <<'YAML'
          name: Validate USMLE Research Drafts

          on:
            pull_request:
              paths:
                - "research/usmle-step1-2026/**"
                - "scripts/validate-usmle-research-drafts.mjs"
                - "scripts/validate-usmle-answer-positions.mjs"
                - "scripts/lib/answer-order-policy.mjs"
                - ".github/workflows/validate-usmle-research.yml"
            push:
              branches:
                - "research/usmle-step1-2026-original-qbank"
              paths:
                - "research/usmle-step1-2026/**"
                - "scripts/validate-usmle-research-drafts.mjs"
                - "scripts/validate-usmle-answer-positions.mjs"
                - "scripts/lib/answer-order-policy.mjs"
                - ".github/workflows/validate-usmle-research.yml"

          permissions:
            contents: read

          jobs:
            validate-private-drafts:
              runs-on: ubuntu-latest
              timeout-minutes: 5
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-node@v4
                  with:
                    node-version: "22"
                - name: Validate JSON, taxonomy, review gates, and original media
                  run: node scripts/validate-usmle-research-drafts.mjs
                - name: Validate authored balance and student answer shuffling
                  run: node scripts/validate-usmle-answer-positions.mjs
          YAML
          git config user.name nextgeninstitute857-bot
          git config user.email nextgeninstitute857-bot@users.noreply.github.com
          git add research/usmle-step1-2026/audits/batch-012-013-committed-stems.tsv .github/workflows/validate-usmle-research.yml
          git commit -m "Record committed Batch 012-013 stems for ZIP audit"
          git push origin HEAD:research/usmle-step1-2026-original-qbank

# This one-time export remains private and has no merge, deploy, import, or publication step.
