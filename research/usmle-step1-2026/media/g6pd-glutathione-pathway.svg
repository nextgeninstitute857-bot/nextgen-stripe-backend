<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-labelledby="title desc">
<title id="title">G6PD, NADPH, and glutathione antioxidant pathway</title><desc id="desc">Pentose phosphate pathway supplies NADPH for glutathione reduction and hydrogen peroxide detoxification.</desc>
<rect width="920" height="520" fill="#ffffff"/>
<text x="40" y="45" font-family="Arial" font-size="28" font-weight="700">Erythrocyte antioxidant defense</text>
<rect x="55" y="115" width="190" height="85" rx="18" fill="#e0f2fe" stroke="#075985" stroke-width="4"/>
<text x="87" y="150" font-family="Arial" font-size="19">Glucose-6-phosphate</text><text x="115" y="180" font-family="Arial" font-size="18">G6PD step</text>
<path d="M245 158 H365" stroke="#111827" stroke-width="5" marker-end="url(#a)"/>
<rect x="365" y="115" width="170" height="85" rx="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/>
<text x="420" y="150" font-family="Arial" font-size="22" font-weight="700">NADPH</text><text x="393" y="180" font-family="Arial" font-size="17">reducing power</text>
<path d="M535 158 H655" stroke="#111827" stroke-width="5" marker-end="url(#a)"/>
<rect x="655" y="115" width="205" height="85" rx="18" fill="#dcfce7" stroke="#166534" stroke-width="4"/>
<text x="688" y="149" font-family="Arial" font-size="20">Oxidized glutathione</text><text x="710" y="180" font-family="Arial" font-size="20">→ Reduced GSH</text>
<path d="M758 200 V300" stroke="#111827" stroke-width="5" marker-end="url(#a)"/>
<rect x="632" y="300" width="250" height="85" rx="18" fill="#f0fdf4" stroke="#166534" stroke-width="4"/>
<text x="684" y="335" font-family="Arial" font-size="20">H₂O₂ → H₂O</text><text x="666" y="365" font-family="Arial" font-size="18">Glutathione peroxidase</text>
<path d="M600 345 H420" stroke="#b91c1c" stroke-width="5" marker-end="url(#r)"/>
<rect x="115" y="295" width="305" height="115" rx="18" fill="#fee2e2" stroke="#991b1b" stroke-width="4"/>
<text x="150" y="330" font-family="Arial" font-size="20" font-weight="700">When NADPH is insufficient</text>
<text x="150" y="362" font-family="Arial" font-size="18">Hemoglobin oxidation → Heinz bodies</text>
<text x="150" y="392" font-family="Arial" font-size="18">Splenic removal → bite cells</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#111827"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b91c1c"/></marker></defs>
</svg>