<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Acute aortic dissection — original AylaMed teaching diagram</title>
<desc id="desc">Recognize that acute aortic dissection can cause organ ischemia through dynamic obstruction by an intimal flap, even without a fixed thrombus in the affected branch artery.</desc>
<style>.bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#26364a;stroke-width:2}.accent{fill:#e9f1ff;stroke:#315a8b;stroke-width:2}.title{font:700 34px Arial;fill:#172536}.subtitle{font:600 20px Arial;fill:#315a8b}.body{font:18px Arial;fill:#172536}.small{font:600 15px Arial;fill:#5a6675}.iconline{fill:none;stroke:#315a8b;stroke-width:8;stroke-linecap:round;stroke-linejoin:round}.alert{fill:none;stroke:#b13b3b;stroke-width:5}</style>
<rect width="1200" height="720" class="bg"/><rect x="30" y="30" width="1140" height="660" rx="28" class="panel"/><text x="70" y="90" class="title">Acute aortic dissection</text><text x="70" y="155" class="subtitle">Intimal tear, false lumen, and dynamic branch-vessel obstruction</text><rect x="70" y="245" width="280" height="320" rx="24" class="accent"/><path d="M95 495 C160 420 120 340 205 275 C245 245 285 265 315 225 M205 275 C235 325 260 370 315 410" class="iconline"/><path d="M205 275 C225 295 230 325 230 355" class="alert"/><rect x="410" y="245" width="330" height="320" rx="24" class="panel"/><text x="440" y="290" class="subtitle">Mechanism</text><text x="440" y="335" class="body">Blood enters through an intimal tear,</text><text x="440" y="370" class="body">creates a false lumen, and the mobile flap</text><text x="440" y="405" class="body">can compress the true lumen or branch ostium.</text><rect x="810" y="245" width="320" height="320" rx="24" class="panel"/><text x="840" y="290" class="subtitle">Key inference</text><text x="840" y="335" class="body">Dynamic flap motion can intermittently</text><text x="840" y="370" class="body">reduce branch perfusion without a fixed</text><text x="840" y="405" class="body">thrombus in that branch.</text><text x="600" y="650" class="small" text-anchor="middle">Original AylaMed vascular teaching diagram — private research draft</text></svg>