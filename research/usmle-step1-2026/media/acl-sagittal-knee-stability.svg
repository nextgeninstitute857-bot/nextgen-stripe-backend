<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Anterior cruciate ligament and anterior tibial translation</title><desc id="d">Original AylaMed sagittal knee diagram showing the ACL and abnormal anterior tibial translation after rupture.</desc><defs><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#b83e3e"/></marker></defs><rect width="900" height="520" rx="28" fill="#f7fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#172033">ACL function in sagittal knee stability</text><rect x="90" y="85" width="720" height="350" rx="24" fill="#fff" stroke="#c7d2df" stroke-width="2"/><path d="M250 120 C225 160 225 220 250 250 C285 290 360 285 395 245 C420 215 415 160 390 120Z" fill="#e9e2d5" stroke="#796a55" stroke-width="4"/><path d="M300 300 C280 335 285 395 320 415 H505 C535 385 535 335 510 300Z" fill="#e9e2d5" stroke="#796a55" stroke-width="4"/><path d="M350 285 L430 145" stroke="#3f6da6" stroke-width="13" stroke-linecap="round"/><text x="455" y="175" font-family="Arial" font-size="19" font-weight="700" fill="#3f6da6">ACL</text><path d="M480 285 L365 145" stroke="#8996a3" stroke-width="10" stroke-linecap="round"/><text x="510" y="205" font-family="Arial" font-size="17" fill="#687583">PCL</text><path d="M420 365 H610" stroke="#b83e3e" stroke-width="6" marker-end="url(#r)"/><text x="520" y="345" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#b83e3e">Anterior tibial translation</text><text x="450" y="470" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#172033">ACL rupture permits excessive anterior tibial motion and pivot instability</text></svg>