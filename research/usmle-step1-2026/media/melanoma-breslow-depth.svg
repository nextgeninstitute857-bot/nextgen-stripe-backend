<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Melanoma Breslow depth</title><desc id="desc">Original AylaMed teaching schematic: radial epidermal spread; vertical dermal invasion; measure to deepest malignant cell; greater thickness -&gt; greater spread risk.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".14"/></filter></defs><rect width="900" height="520" rx="28" fill="#f8fafc"/><text x="450" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Melanoma Breslow depth</text><text x="450" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">AylaMed original mechanism-first schematic</text><rect x="55" y="150" width="160" height="95" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" filter="url(#shadow)"/><text x="135" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0c4a6e">radial epidermal</text><text x="135" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0c4a6e">spread</text><path d="M215 197 C240 197 240 322 265 322" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="265" y="275" width="160" height="95" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" filter="url(#shadow)"/><text x="345" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0c4a6e">vertical dermal</text><text x="345" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0c4a6e">invasion</text><path d="M425 322 C450 322 450 197 475 197" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="475" y="150" width="160" height="95" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" filter="url(#shadow)"/><text x="555" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0c4a6e">measure to deepest</text><text x="555" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0c4a6e">malignant cell</text><path d="M635 197 C660 197 660 322 685 322" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="685" y="275" width="160" height="95" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3" filter="url(#shadow)"/><text x="765" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0c4a6e">greater thickness -&gt;</text><text x="765" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0c4a6e">greater spread risk</text><circle cx="180" cy="440" r="10" fill="#0284c7" opacity="0.35"/><circle cx="315" cy="440" r="15" fill="#0284c7" opacity="0.47"/><circle cx="450" cy="440" r="20" fill="#0284c7" opacity="0.59"/><circle cx="585" cy="440" r="10" fill="#0284c7" opacity="0.71"/><circle cx="720" cy="440" r="15" fill="#0284c7" opacity="0.83"/></svg>