<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Breslow thickness</title><desc id="desc">Vertical depth is a major prognostic measurement in melanoma</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".13"/></filter></defs><rect width="1000" height="620" rx="28" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Breslow thickness</text><text x="500" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">Vertical depth is a major prognostic measurement in melanoma</text><rect x="70" y="120" width="390" height="360" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/><text x="265.0" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Skin section</text><text x="265.0" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">granular layer at surface</text><text x="265.0" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">invasive melanoma nest</text><text x="265.0" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">deepest malignant cell</text><rect x="540" y="120" width="390" height="360" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/><text x="735.0" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Measurement</text><text x="735.0" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">start: top of granular layer</text><text x="735.0" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">end: deepest tumor cell</text><text x="735.0" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">greater depth = higher risk</text><path d="M460 300 L540 300" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="500.0" y="292.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">vertical measure</text><text x="500" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Ulcerated lesions are measured from the ulcer base to the deepest invasive cell.</text></svg>