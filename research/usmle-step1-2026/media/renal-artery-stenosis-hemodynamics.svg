<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><rect width="900" height="520" fill="#fff"/><text x="35" y="42" font-family="Arial" font-size="26" font-weight="700">Glomerular pressure in bilateral renal artery stenosis</text><text x="225" y="90" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">Before ACE inhibition</text><text x="675" y="90" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700">After ACE inhibition</text><line x1="40" y1="230" x2="155" y2="230" stroke="#2563eb" stroke-width="22"/><ellipse cx="235" cy="230" rx="78" ry="92" fill="#dbeafe" stroke="#1d4ed8" stroke-width="5"/><path d="M185 175 C250 115,290 180,230 220 C170 260,225 330,285 265" fill="none" stroke="#1d4ed8" stroke-width="8"/><line x1="313" y1="230" x2="405" y2="230" stroke="#2563eb" stroke-width="10"/><text x="355" y="205" font-family="Arial" font-size="16">constricted efferent</text><text x="225" y="365" text-anchor="middle" font-family="Arial" font-size="19">Ang II preserves PGC and GFR</text><line x1="490" y1="230" x2="595" y2="230" stroke="#2563eb" stroke-width="22"/><ellipse cx="675" cy="230" rx="78" ry="92" fill="#eff6ff" stroke="#60a5fa" stroke-width="5"/><path d="M625 175 C690 115,730 180,670 220 C610 260,665 330,725 265" fill="none" stroke="#60a5fa" stroke-width="8"/><line x1="753" y1="230" x2="870" y2="230" stroke="#2563eb" stroke-width="22"/><text x="805" y="205" font-family="Arial" font-size="16">dilated efferent</text><text x="675" y="365" text-anchor="middle" font-family="Arial" font-size="19">↓ PGC → ↓ GFR</text><text x="450" y="450" text-anchor="middle" font-family="Arial" font-size="18">PGC = glomerular capillary hydrostatic pressure</text></svg>
