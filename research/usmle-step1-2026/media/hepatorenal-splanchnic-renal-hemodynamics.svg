<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Hepatorenal syndrome hemodynamics</title><desc id="d">Original schematic linking cirrhosis and portal hypertension to splanchnic vasodilation, reduced effective arterial volume, neurohormonal activation, and renal vasoconstriction.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#334155"/></marker></defs><rect width="900" height="520" rx="28" fill="#f8fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Hepatorenal syndrome: functional renal failure</text><rect x="45" y="110" width="210" height="140" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="150" y="150" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Cirrhosis</text><path d="M90 195 q60-55 120 0 q-55 45-120 0z" fill="#f59e0b" stroke="#92400e" stroke-width="3"/><rect x="340" y="80" width="240" height="150" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="460" y="120" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Splanchnic vasodilation</text><text x="460" y="158" text-anchor="middle" font-family="Arial" font-size="16">NO-mediated pooling</text><text x="460" y="192" text-anchor="middle" font-family="Arial" font-size="16">effective arterial volume ↓</text><path d="M255 170 L340 150" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><rect x="645" y="80" width="210" height="150" rx="20" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="750" y="120" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">RAAS / SNS / ADH</text><text x="750" y="165" text-anchor="middle" font-family="Arial" font-size="17">activated</text><path d="M580 150 L645 150" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><rect x="260" y="315" width="380" height="140" rx="20" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/><text x="450" y="355" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Renal vasoconstriction</text><path d="M335 400 q45-80 90 0 q-45 55-90 0z" fill="#fecaca" stroke="#be123c" stroke-width="4"/><path d="M475 400 q45-80 90 0 q-45 55-90 0z" fill="#fecaca" stroke="#be123c" stroke-width="4"/><text x="450" y="438" text-anchor="middle" font-family="Arial" font-size="16">GFR ↓ with structurally intact kidneys</text><path d="M750 230 C720 300 640 330 610 350" stroke="#334155" stroke-width="5" fill="none" marker-end="url(#a)"/></svg>