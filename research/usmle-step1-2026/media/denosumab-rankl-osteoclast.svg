<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Osteoclast signaling in osteoporosis</title><desc id="desc">Original schematic of ligand-receptor signaling between osteoblast-lineage cells and osteoclast precursors with a therapeutic antibody in the extracellular space.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".14"/></filter>
</defs>
<rect width="900" height="520" rx="28" fill="#f8fafc"/>
<text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Osteoclast signaling in osteoporosis</text>
<rect x="60" y="125" width="230" height="130" rx="18" fill="#eef2ff" stroke="#6366f1" stroke-width="2" filter="url(#shadow)"/>
<text x="175.0" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Osteoblast-lineage cell</text>
<text x="175.0" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">surface ligand</text><rect x="610" y="125" width="230" height="130" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
<text x="725.0" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Osteoclast precursor</text>
<text x="725.0" y="187" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">surface receptor</text><path d="M290 190 L610 190" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="450.0" y="180.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">cell-to-cell signal</text><path d="M420 135 q30 -35 60 0 q-30 35 -60 0" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="450" y="115" text-anchor="middle" font-family="Arial" font-size="16" fill="#1e3a8a">therapeutic antibody</text><rect x="255" y="330" width="390" height="100" rx="18" fill="#f1f5f9" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
<text x="450.0" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Bone-resorption readout</text>
<text x="450.0" y="392" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">osteoclast number • activity • survival</text>
</svg>