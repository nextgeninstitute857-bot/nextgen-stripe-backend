<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">EGFR signaling in lung adenocarcinoma</title><desc id="d">Original schematic showing ligand-independent EGFR activation, downstream RAS-MAPK and PI3K-AKT signaling, and inhibition by an EGFR tyrosine-kinase inhibitor.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#334155"/></marker></defs><rect width="900" height="520" rx="28" fill="#f8fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">EGFR-driven lung adenocarcinoma</text><line x1="60" y1="170" x2="840" y2="170" stroke="#94a3b8" stroke-width="10"/><text x="95" y="145" font-family="Arial" font-size="16">cell membrane</text><g fill="#60a5fa" stroke="#1d4ed8" stroke-width="3"><rect x="250" y="105" width="55" height="130" rx="18"/><rect x="315" y="105" width="55" height="130" rx="18"/></g><text x="310" y="85" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">EGFR dimer</text><circle cx="277" cy="255" r="18" fill="#f59e0b"/><circle cx="342" cy="255" r="18" fill="#f59e0b"/><text x="310" y="295" text-anchor="middle" font-family="Arial" font-size="16">constitutive kinase activity</text><path d="M310 305 L310 355" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><rect x="150" y="365" width="230" height="95" rx="18" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="265" y="402" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">RAS → RAF → MEK → ERK</text><text x="265" y="435" text-anchor="middle" font-family="Arial" font-size="16">proliferation</text><rect x="520" y="365" width="230" height="95" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="635" y="402" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">PI3K → AKT</text><text x="635" y="435" text-anchor="middle" font-family="Arial" font-size="16">survival</text><path d="M310 330 C260 345 250 355 250 365" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#a)"/><path d="M310 330 C500 335 610 345 620 365" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#a)"/><rect x="555" y="85" width="240" height="145" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="675" y="125" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">EGFR tyrosine-kinase inhibitor</text><line x1="620" y1="165" x2="730" y2="165" stroke="#dc2626" stroke-width="12"/><line x1="675" y1="120" x2="675" y2="210" stroke="#dc2626" stroke-width="12"/></svg>