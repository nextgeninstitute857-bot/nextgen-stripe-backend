<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">HPV E7, RB, and p16 in oropharyngeal cancer</title><desc id="desc">Cell-cycle feedback explains diffuse p16 block staining</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".13"/></filter></defs><rect width="1000" height="620" rx="28" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">HPV E7, RB, and p16 in oropharyngeal cancer</text><text x="500" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">Cell-cycle feedback explains diffuse p16 block staining</text><rect x="65" y="145" width="240" height="220" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/><text x="185.0" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">High-risk HPV</text><text x="185.0" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">E7 oncoprotein</text><text x="185.0" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">tonsillar crypt epithelium</text><rect x="380" y="145" width="240" height="220" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/><text x="500.0" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">RB pathway</text><text x="500.0" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">E7 binds RB</text><text x="500.0" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">E2F released</text><text x="500.0" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">G1/S progression</text><rect x="695" y="145" width="240" height="220" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/><text x="815.0" y="177" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Feedback marker</text><text x="815.0" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">p16 accumulates</text><text x="815.0" y="231" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">diffuse block staining</text><path d="M305 255 L380 255" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="342.5" y="247.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">E7</text><path d="M620 255 L695 255" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="657.5" y="247.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">loss of RB restraint</text><text x="500" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">p16 overexpression is a surrogate of transcriptionally active HPV in the correct setting.</text></svg>