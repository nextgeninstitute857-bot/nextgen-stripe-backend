<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Bilateral vestibular schwannomas on axial MRI</title><desc id="d">Original AylaMed schematic axial MRI showing bilateral cerebellopontine-angle masses extending into both internal auditory canals.</desc><rect width="900" height="520" rx="28" fill="#f7fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#172033">Bilateral cerebellopontine-angle masses</text><ellipse cx="450" cy="270" rx="270" ry="180" fill="#e7edf4" stroke="#25354a" stroke-width="4"/><path d="M450 130 C390 155 360 210 365 275 C370 350 410 395 450 410 C490 395 530 350 535 275 C540 210 510 155 450 130Z" fill="#d7dee8" stroke="#607086" stroke-width="2"/><ellipse cx="335" cy="270" rx="54" ry="38" fill="#8bb6d9" stroke="#315b7d" stroke-width="3"/><ellipse cx="565" cy="270" rx="54" ry="38" fill="#8bb6d9" stroke="#315b7d" stroke-width="3"/><rect x="250" y="252" width="70" height="36" rx="16" fill="#c4cfdb" stroke="#607086" stroke-width="2"/><rect x="580" y="252" width="70" height="36" rx="16" fill="#c4cfdb" stroke="#607086" stroke-width="2"/><path d="M320 270 H275" stroke="#315b7d" stroke-width="8"/><path d="M580 270 H625" stroke="#315b7d" stroke-width="8"/><text x="335" y="335" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#315b7d">Left vestibular schwannoma</text><text x="565" y="335" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#315b7d">Right vestibular schwannoma</text><text x="450" y="472" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Bilateral tumors strongly suggest NF2-related schwannomatosis</text></svg>