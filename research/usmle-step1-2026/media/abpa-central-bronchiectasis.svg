<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Allergic bronchopulmonary aspergillosis</title><desc id="d">Original AylaMed chest diagram showing central bronchiectasis and branching mucus impaction in an asthmatic airway.</desc><rect width="900" height="520" rx="28" fill="#f7fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#172033">ABPA: central bronchiectasis and mucus impaction</text><rect x="55" y="85" width="790" height="340" rx="24" fill="#fff" stroke="#c7d2df" stroke-width="2"/><path d="M320 125 C220 145 170 245 200 355 C245 405 330 385 370 320 L370 155 C355 138 338 128 320 125Z" fill="#dbe9ee" stroke="#527381" stroke-width="3"/><path d="M580 125 C680 145 730 245 700 355 C655 405 570 385 530 320 L530 155 C545 138 562 128 580 125Z" fill="#dbe9ee" stroke="#527381" stroke-width="3"/><path d="M450 120 V210 M450 175 L360 235 M450 175 L540 235 M360 235 L310 300 M360 235 L390 315 M540 235 L590 300 M540 235 L510 315" stroke="#355e76" stroke-width="18" stroke-linecap="round" fill="none"/><path d="M450 120 V210 M450 175 L360 235 M450 175 L540 235 M360 235 L310 300 M360 235 L390 315 M540 235 L590 300 M540 235 L510 315" stroke="#e0a34f" stroke-width="8" stroke-linecap="round" fill="none"/><circle cx="360" cy="235" r="28" fill="none" stroke="#b14f4f" stroke-width="5"/><circle cx="540" cy="235" r="28" fill="none" stroke="#b14f4f" stroke-width="5"/><text x="450" y="390" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Dilated central bronchi with branching mucus plugs</text><text x="450" y="470" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Asthma/CF + eosinophilia + very high IgE + fleeting infiltrates</text></svg>