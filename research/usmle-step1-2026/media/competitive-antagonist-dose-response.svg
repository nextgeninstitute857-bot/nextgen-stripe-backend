<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Competitive antagonist dose-response shift</title><desc id="d">Original AylaMed graph showing a parallel rightward shift in agonist concentration response with the same maximum effect.</desc><rect width="900" height="520" rx="28" fill="#f7fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#172033">Reversible competitive antagonism</text><line x1="120" y1="430" x2="800" y2="430" stroke="#24324a" stroke-width="4"/><line x1="120" y1="430" x2="120" y2="90" stroke="#24324a" stroke-width="4"/><text x="460" y="485" text-anchor="middle" font-family="Arial" font-size="20" fill="#172033">log agonist concentration</text><text x="42" y="270" transform="rotate(-90 42 270)" text-anchor="middle" font-family="Arial" font-size="20" fill="#172033">Response (% of Emax)</text><line x1="120" y1="130" x2="800" y2="130" stroke="#8392a5" stroke-width="2" stroke-dasharray="8 7"/><text x="812" y="136" font-family="Arial" font-size="16" fill="#425466">same Emax</text><path d="M145 420 C215 416 245 390 275 315 C305 235 340 155 435 135 C500 121 560 130 605 130" fill="none" stroke="#2d7a62" stroke-width="8"/><path d="M300 420 C370 416 400 390 430 315 C460 235 495 155 590 135 C655 121 715 130 760 130" fill="none" stroke="#b65454" stroke-width="8"/><line x1="350" y1="430" x2="350" y2="275" stroke="#2d7a62" stroke-width="2" stroke-dasharray="7 6"/><line x1="505" y1="430" x2="505" y2="275" stroke="#b65454" stroke-width="2" stroke-dasharray="7 6"/><line x1="120" y1="275" x2="505" y2="275" stroke="#8392a5" stroke-width="2" stroke-dasharray="7 6"/><text x="350" y="454" text-anchor="middle" font-family="Arial" font-size="16" fill="#2d7a62">EC50 control</text><text x="505" y="454" text-anchor="middle" font-family="Arial" font-size="16" fill="#b65454">EC50 + antagonist</text><rect x="585" y="310" width="245" height="96" rx="16" fill="#ffffff" stroke="#c7d2df" stroke-width="2"/><line x1="610" y1="338" x2="660" y2="338" stroke="#2d7a62" stroke-width="7"/><text x="675" y="344" font-family="Arial" font-size="17" fill="#172033">Agonist alone</text><line x1="610" y1="376" x2="660" y2="376" stroke="#b65454" stroke-width="7"/><text x="675" y="382" font-family="Arial" font-size="17" fill="#172033">+ competitive antagonist</text><text x="450" y="72" text-anchor="middle" font-family="Arial" font-size="17" fill="#425466">Higher agonist concentration overcomes receptor competition</text></svg>