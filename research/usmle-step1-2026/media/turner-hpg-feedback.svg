<line x1="195" y1="215" x2="195" y2="285" stroke="#0f172a" stroke-width="5"/><polygon points="185,275 205,275 195,295" fill="#0f172a"/><text x="215" y="260" font-family="Arial" font-size="18">GnRH</text>
