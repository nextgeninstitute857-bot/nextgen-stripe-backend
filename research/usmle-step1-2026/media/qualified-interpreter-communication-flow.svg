<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Qualified interpreter communication flow</title><desc id="d">Original AylaMed diagram showing the clinician and patient maintaining the primary relationship while a qualified interpreter transmits information in both directions.</desc><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#24324a"/></marker></defs><rect width="900" height="520" rx="28" fill="#f7fafc"/><text x="450" y="44" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#172033">Language access during informed decision-making</text><circle cx="180" cy="230" r="92" fill="#e6f1ff" stroke="#426aa8" stroke-width="4"/><circle cx="720" cy="230" r="92" fill="#e8f5ef" stroke="#2d7a62" stroke-width="4"/><circle cx="450" cy="365" r="85" fill="#f3ebff" stroke="#7651a8" stroke-width="4"/><text x="180" y="218" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#29437d">Clinician</text><text x="180" y="248" text-anchor="middle" font-family="Arial" font-size="16" fill="#29437d">explains and asks</text><text x="720" y="218" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#245a49">Patient</text><text x="720" y="248" text-anchor="middle" font-family="Arial" font-size="16" fill="#245a49">decides and responds</text><text x="450" y="350" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#5b3888">Qualified</text><text x="450" y="377" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#5b3888">interpreter</text><text x="450" y="405" text-anchor="middle" font-family="Arial" font-size="14" fill="#5b3888">accurate, confidential, complete</text><path d="M275 205 C390 130 510 130 625 205" fill="none" stroke="#24324a" stroke-width="4" marker-end="url(#m)"/><path d="M625 255 C510 315 390 315 275 255" fill="none" stroke="#24324a" stroke-width="4" marker-end="url(#m)"/><text x="450" y="128" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#172033">Address the patient directly</text><text x="450" y="295" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#172033">Verify understanding and voluntariness</text><line x1="250" y1="290" x2="385" y2="335" stroke="#7651a8" stroke-width="4" marker-end="url(#m)"/><line x1="650" y1="290" x2="515" y2="335" stroke="#7651a8" stroke-width="4" marker-end="url(#m)"/><line x1="385" y1="385" x2="250" y2="310" stroke="#7651a8" stroke-width="4" marker-end="url(#m)"/><line x1="515" y1="385" x2="650" y2="310" stroke="#7651a8" stroke-width="4" marker-end="url(#m)"/><rect x="125" y="455" width="650" height="42" rx="16" fill="#ffffff" stroke="#c7d2df" stroke-width="2"/><text x="450" y="482" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#172033">Offer competent language assistance at no cost; avoid untrained family interpreters for substantive consent.</text></svg>