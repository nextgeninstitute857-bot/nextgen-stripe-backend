<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Enteric hyperoxaluria after ileal disease</title><desc id="desc">Fat malabsorption frees oxalate for colonic absorption</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".13"/></filter></defs><rect width="1000" height="620" rx="28" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Enteric hyperoxaluria after ileal disease</text><text x="500" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">Fat malabsorption frees oxalate for colonic absorption</text><rect x="40" y="130" width="280" height="260" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/><text x="180.0" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Fat malabsorption</text><text x="180.0" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">unabsorbed fatty acids</text><text x="180.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">bile-salt loss</text><rect x="360" y="130" width="280" height="260" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/><text x="500.0" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Colon lumen</text><text x="500.0" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">fatty acids bind calcium</text><text x="500.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">free oxalate remains</text><text x="500.0" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">oxalate absorbed</text><rect x="680" y="130" width="280" height="260" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/><text x="820.0" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Kidney</text><text x="820.0" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">hyperoxaluria</text><text x="820.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">calcium oxalate crystals</text><text x="820.0" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">stone formation</text><path d="M320 260 L360 260" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="340.0" y="252.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">binds Ca</text><path d="M640 260 L680 260" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="660.0" y="252.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">absorbed then filtered</text><text x="500" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Normal luminal calcium limits oxalate absorption by forming insoluble calcium oxalate.</text></svg>