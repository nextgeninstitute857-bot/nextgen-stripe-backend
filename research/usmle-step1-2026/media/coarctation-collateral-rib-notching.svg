<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Coarctation collateral circulation</title><desc id="d">Original arterial map of subclavian, internal thoracic, intercostal, and descending aortic collateral flow with rib notching.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#334155"/></marker></defs><rect width="900" height="520" rx="28" fill="#f8fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Postductal coarctation collateral route</text><path d="M430 80v350" stroke="#dc2626" stroke-width="34"/><path d="M430 215q-45 30 0 60" fill="none" stroke="#7f1d1d" stroke-width="16"/><text x="455" y="250" font-family="Arial" font-size="17">narrowing</text><path d="M430 115H210v260h220" fill="none" stroke="#2563eb" stroke-width="10" marker-end="url(#a)"/><text x="250" y="105" font-family="Arial" font-size="17">subclavian</text><text x="110" y="245" font-family="Arial" font-size="17">internal thoracic</text><text x="245" y="402" font-family="Arial" font-size="17">intercostal collaterals</text><g stroke="#94a3b8" stroke-width="12" fill="none"><path d="M565 135q120 25 0 55"/><path d="M565 215q120 25 0 55"/><path d="M565 295q120 25 0 55"/></g><g stroke="#2563eb" stroke-width="8"><path d="M565 160h100"/><path d="M565 240h100"/><path d="M565 320h100"/></g><g fill="#f8fafc" stroke="#2563eb" stroke-width="4"><ellipse cx="665" cy="160" rx="22" ry="11"/><ellipse cx="665" cy="240" rx="22" ry="11"/><ellipse cx="665" cy="320" rx="22" ry="11"/></g><text x="675" y="375" text-anchor="middle" font-family="Arial" font-size="17">enlarged intercostal arteries erode inferior rib margins</text><text x="450" y="478" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Upper-body hypertension with delayed femoral pulses and bilateral inferior rib notching</text></svg>