<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Keloid versus hypertrophic scar</title><desc id="desc">Keloids invade beyond the original wound boundary</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".13"/></filter></defs><rect width="1000" height="620" rx="28" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Keloid versus hypertrophic scar</text><text x="500" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">Keloids invade beyond the original wound boundary</text><rect x="40" y="130" width="280" height="250" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/><text x="180.0" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Normal remodeling</text><text x="180.0" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">wound closes</text><text x="180.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">collagen reorganizes</text><rect x="360" y="130" width="280" height="250" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/><text x="500.0" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Hypertrophic scar</text><text x="500.0" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">raised but confined</text><text x="500.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">may regress</text><rect x="680" y="130" width="280" height="250" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/><text x="820.0" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Keloid</text><text x="820.0" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">extends beyond wound</text><text x="820.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">type III early</text><text x="820.0" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">type I later</text><path d="M320 260 L360 260" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="340.0" y="252.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">comparison</text><path d="M640 260 L680 260" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="660.0" y="252.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">comparison</text><text x="500" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Keloids show persistent fibroproliferation and frequent recurrence.</text></svg>