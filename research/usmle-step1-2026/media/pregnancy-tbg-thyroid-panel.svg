<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 500" role="img" aria-labelledby="title desc"><title id="title">Thyroid laboratory pattern during normal pregnancy</title><desc id="desc">Original panel showing increased estrogen and thyroxine-binding globulin, increased total thyroxine, and approximately maintained free thyroxine in a euthyroid pregnancy.</desc><rect width="820" height="500" fill="#fff"/><line x1="85" y1="410" x2="750" y2="410" stroke="#111" stroke-width="3"/><line x1="85" y1="410" x2="85" y2="75" stroke="#111" stroke-width="3"/><text x="30" y="305" font-family="Arial" font-size="20" transform="rotate(-90 30 305)">Relative concentration</text><rect x="125" y="130" width="105" height="280" fill="#a15d97"/><rect x="280" y="115" width="105" height="295" fill="#b86b31"/><rect x="435" y="245" width="105" height="165" fill="#2d6f9b"/><rect x="590" y="250" width="105" height="160" fill="#4f7f9d"/><text x="158" y="445" font-family="Arial" font-size="19">TBG</text><text x="292" y="445" font-family="Arial" font-size="19">Total T4</text><text x="451" y="445" font-family="Arial" font-size="19">Free T4</text><text x="618" y="445" font-family="Arial" font-size="19">TSH</text><text x="120" y="105" font-family="Arial" font-size="18">↑ estrogen effect</text><text x="285" y="92" font-family="Arial" font-size="18">↑ bound hormone</text><text x="425" y="225" font-family="Arial" font-size="18">near normal</text><text x="585" y="230" font-family="Arial" font-size="18">trimester-adjusted</text><path d="M170 60 C250 20 330 30 360 75" fill="none" stroke="#a15d97" stroke-width="4" marker-end="url(#a)"/><text x="380" y="65" font-family="Arial" font-size="20">New equilibrium preserves active free hormone</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a15d97"/></marker></defs></svg>