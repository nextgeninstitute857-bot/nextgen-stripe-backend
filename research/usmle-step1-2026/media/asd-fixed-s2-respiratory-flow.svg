<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><style>text{font-family:Arial;fill:#172536}.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700;fill:#315a8b}.b{font-size:19px}.p{fill:#fff;stroke:#26364a;stroke-width:2}.a{fill:#e9f1ff;stroke:#315a8b;stroke-width:2}.r{stroke:#b13b3b;stroke-width:7;fill:none}</style><rect width="1200" height="720" fill="#f7f9fc"/><text x="60" y="70" class="t">Atrial septal defect: fixed S2 splitting</text><rect x="60" y="145" width="330" height="400" rx="25" class="a"/><text x="105" y="220" class="h">Left-to-right atrial shunt</text><text x="100" y="285" class="b">Chronic RV volume loading</text><text x="110" y="335" class="b">Prolonged pulmonic ejection</text><path d="M390 345 H510" class="r"/><rect x="510" y="145" width="630" height="400" rx="25" class="p"/><text x="570" y="220" class="h">Why fixed?</text><text x="570" y="285" class="b">Inspiratory venous return rises while left-to-right shunt falls</text><text x="570" y="335" class="b">Counterbalanced RV filling keeps P2 delay nearly constant</text></svg>