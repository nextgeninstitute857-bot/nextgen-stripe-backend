<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Pleural effusion pseudoexudate — original AylaMed teaching diagram</title><desc id="desc">Diuresis can concentrate pleural protein and LDH; the serum-to-pleural albumin gradient may recover the underlying hydrostatic physiology.</desc><style>.bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#26364a;stroke-width:2}.accent{fill:#e9f1ff;stroke:#315a8b;stroke-width:2}.title{font:700 34px Arial;fill:#172536}.subtitle{font:600 20px Arial;fill:#315a8b}.body{font:18px Arial;fill:#172536}.small{font:600 15px Arial;fill:#5a6675}.line{stroke:#315a8b;stroke-width:5}.alert{stroke:#b13b3b;stroke-width:5}</style><rect width="1200" height="720" class="bg"/><rect x="30" y="30" width="1140" height="660" rx="28" class="panel"/><text x="70" y="90" class="title">Pleural effusion after diuresis</text><text x="70" y="155" class="subtitle">Light criteria and hydrostatic pseudoexudate</text><rect x="70" y="245" width="280" height="320" rx="24" class="accent"/><rect x="110" y="285" width="190" height="220" rx="18" class="panel"/><line x1="140" y1="335" x2="270" y2="335" class="line"/><line x1="140" y1="390" x2="245" y2="390" class="line"/><line x1="140" y1="445" x2="285" y2="445" class="alert"/><rect x="410" y="245" width="330" height="320" rx="24" class="panel"/><text x="440" y="290" class="subtitle">Mechanism</text><text x="440" y="335" class="body">Diuresis removes water faster than protein</text><text x="440" y="370" class="body">leaves the pleural space, concentrating</text><text x="440" y="405" class="body">protein and LDH enough to meet Light criteria.</text><rect x="810" y="245" width="320" height="320" rx="24" class="panel"/><text x="840" y="290" class="subtitle">Recovery test</text><text x="840" y="335" class="body">A serum-to-pleural albumin gradient greater</text><text x="840" y="370" class="body">than about 1.2 g/dL supports the underlying</text><text x="840" y="405" class="body">transudative hydrostatic process.</text><text x="600" y="650" class="small" text-anchor="middle">Original AylaMed laboratory comparison — private research draft</text></svg>