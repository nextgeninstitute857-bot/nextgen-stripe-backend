<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Brown-Sequard spinal tract schematic</title><desc id="desc">Original AylaMed educational schematic. Not derived from proprietary question-bank media.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#23395d"/></marker><style>.t{font:20px Arial,sans-serif;fill:#172033}.s{font:16px Arial,sans-serif;fill:#172033}.b{fill:#eef4ff;stroke:#23395d;stroke-width:3}.r{fill:#fff1f1;stroke:#8a2432;stroke-width:3}.g{fill:#eef9f0;stroke:#2d6a3f;stroke-width:3}.ln{stroke:#23395d;stroke-width:4;fill:none;marker-end:url(#arrow)}</style></defs><rect width="960" height="560" fill="white"/><text x="40" y="45" class="t">Left spinal hemisection: tract localization</text><circle cx="480" cy="270" r="180" fill="#eef4ff" stroke="#23395d" stroke-width="5"/><path d="M480 90 L480 450 A180 180 0 0 1 480 90" fill="#ffdede" opacity="0.85"/><text x="310" y="95" class="s">Left hemicord lesion</text><circle cx="395" cy="165" r="35" class="g"/><text x="360" y="220" class="s">Dorsal column</text><circle cx="350" cy="325" r="38" class="b"/><text x="285" y="385" class="s">Corticospinal</text><circle cx="620" cy="330" r="38" class="r"/><text x="570" y="390" class="s">Spinothalamic</text><path d="M190 180 L340 180" class="ln"/><text x="65" y="155" class="s">Ipsilateral vibration</text><text x="65" y="180" class="s">and proprioception loss</text><path d="M190 330 L300 330" class="ln"/><text x="65" y="305" class="s">Ipsilateral UMN</text><text x="65" y="330" class="s">weakness below lesion</text><path d="M770 330 L665 330" class="ln"/><text x="745" y="305" class="s">Contralateral pain/</text><text x="745" y="330" class="s">temperature loss</text><text x="300" y="500" class="s">DCML + corticospinal cross in medulla; spinothalamic crosses near entry</text><text x="30" y="535" class="s">AylaMed original teaching graphic • private research draft</text></svg>