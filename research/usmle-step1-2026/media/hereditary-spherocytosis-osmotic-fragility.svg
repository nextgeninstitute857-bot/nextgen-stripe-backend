<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Hereditary spherocytosis and osmotic fragility</title><desc id="desc">Comparison of normal biconcave cells and spherocytes with a graph showing spherocytes lyse at higher sodium chloride concentrations.</desc>
<rect width="900" height="520" fill="#ffffff"/>
<text x="40" y="46" font-family="Arial" font-size="28" font-weight="700">Membrane loss lowers surface-area-to-volume ratio</text>
<text x="120" y="95" font-family="Arial" font-size="20">Normal erythrocyte</text>
<ellipse cx="210" cy="175" rx="78" ry="58" fill="#f6b3b3" stroke="#7f1d1d" stroke-width="5"/>
<ellipse cx="210" cy="175" rx="38" ry="22" fill="#ffffff" opacity="0.75"/>
<text x="390" y="95" font-family="Arial" font-size="20">Spherocyte</text>
<circle cx="465" cy="175" r="60" fill="#e57373" stroke="#7f1d1d" stroke-width="5"/>
<text x="545" y="150" font-family="Arial" font-size="18">Rigid cell</text>
<text x="545" y="178" font-family="Arial" font-size="18">No central pallor</text>
<text x="545" y="206" font-family="Arial" font-size="18">Splenic trapping</text>
<line x1="110" y1="455" x2="800" y2="455" stroke="#111827" stroke-width="3"/>
<line x1="110" y1="455" x2="110" y2="280" stroke="#111827" stroke-width="3"/>
<text x="345" y="500" font-family="Arial" font-size="18">NaCl concentration decreases → more hypotonic</text>
<text x="25" y="370" font-family="Arial" font-size="18" transform="rotate(-90 25 370)">Percent hemolysis</text>
<path d="M145 438 C260 435 330 420 410 350 C470 300 520 295 575 292" fill="none" stroke="#2563eb" stroke-width="7"/>
<path d="M145 438 C220 430 260 390 315 330 C360 285 420 280 480 278" fill="none" stroke="#b91c1c" stroke-width="7"/>
<line x1="665" y1="320" x2="715" y2="320" stroke="#b91c1c" stroke-width="7"/><text x="725" y="326" font-family="Arial" font-size="17">Spherocytes</text>
<line x1="665" y1="355" x2="715" y2="355" stroke="#2563eb" stroke-width="7"/><text x="725" y="361" font-family="Arial" font-size="17">Normal cells</text>
<text x="200" y="270" font-family="Arial" font-size="18" font-weight="700">Lysis begins earlier</text>
</svg>