<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Invasive Aspergillus angioinvasion and CT halo</title><desc id="d">Original AylaMed diagram showing acute-angle septate hyphae invading a pulmonary vessel and a hemorrhagic halo around a nodule.</desc><rect width="900" height="520" rx="28" fill="#f7fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#172033">Invasive Aspergillus: angioinvasion and hemorrhagic halo</text><rect x="45" y="85" width="390" height="340" rx="22" fill="#fff" stroke="#c7d2df" stroke-width="2"/><circle cx="240" cy="245" r="112" fill="#eadada" stroke="#a95a5a" stroke-width="4"/><circle cx="240" cy="245" r="62" fill="#9f5d68" stroke="#6e3942" stroke-width="4"/><circle cx="240" cy="245" r="92" fill="none" stroke="#d19a9a" stroke-width="20" opacity=".75"/><text x="240" y="390" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Ground-glass halo = surrounding hemorrhage</text><rect x="475" y="85" width="380" height="340" rx="22" fill="#fff" stroke="#c7d2df" stroke-width="2"/><path d="M520 250 C600 205 720 205 815 250" fill="none" stroke="#b35a64" stroke-width="60" stroke-linecap="round"/><path d="M560 305 L650 235 L730 165 M650 235 L745 295" fill="none" stroke="#445e65" stroke-width="8" stroke-linecap="round"/><line x1="602" y1="272" x2="615" y2="287" stroke="#f7fafc" stroke-width="3"/><line x1="635" y1="245" x2="650" y2="260" stroke="#f7fafc" stroke-width="3"/><line x1="680" y1="213" x2="695" y2="228" stroke="#f7fafc" stroke-width="3"/><text x="665" y="365" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Septate hyphae branch at acute angles</text><text x="450" y="470" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Vessel invasion → thrombosis, infarction, and alveolar hemorrhage</text></svg>