<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Hydatidiform mole: parental genome origin</title><desc id="desc">Parental-origin comparison of complete androgenetic diploid mole and partial diandric triploid mole.</desc>
<rect width="1000" height="620" fill="#ffffff"/><rect x="20" y="20" width="960" height="580" rx="20" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="50" y="65" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Hydatidiform mole: parental genome origin</text>
<rect x="55" y="105" width="430" height="420" rx="16" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/><text x="90" y="145" font-family="Arial" font-size="24" font-weight="700">Complete mole</text>
<circle cx="165" cy="235" r="65" fill="#ffffff" stroke="#64748b" stroke-width="4"/><text x="110" y="325" font-family="Arial" font-size="18">Empty ovum</text><circle cx="365" cy="235" r="30" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="320" y="295" font-family="Arial" font-size="18">X sperm</text>
<line x1="230" y1="235" x2="325" y2="235" stroke="#0f172a" stroke-width="5"/><polygon points="315,225 315,245 330,235" fill="#0f172a"/><line x1="270" y1="340" x2="270" y2="405" stroke="#0f172a" stroke-width="5"/><polygon points="260,395 280,395 270,415" fill="#0f172a"/>
<text x="135" y="450" font-family="Arial" font-size="21">Paternal duplication → 46,XX</text><text x="120" y="485" font-family="Arial" font-size="19">Androgenetic; p57 absent</text>
<rect x="515" y="105" width="430" height="420" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/><text x="550" y="145" font-family="Arial" font-size="24" font-weight="700">Partial mole</text>
<circle cx="625" cy="235" r="65" fill="#fce7f3" stroke="#be185d" stroke-width="4"/><text x="565" y="325" font-family="Arial" font-size="18">Normal ovum</text><circle cx="790" cy="205" r="28" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><circle cx="855" cy="255" r="28" fill="#dbeafe" stroke="#1d4ed8" stroke-width="3"/><text x="770" y="320" font-family="Arial" font-size="18">Two sperm</text>
<line x1="720" y1="235" x2="760" y2="220" stroke="#0f172a" stroke-width="4"/><line x1="720" y1="245" x2="820" y2="255" stroke="#0f172a" stroke-width="4"/><line x1="730" y1="340" x2="730" y2="405" stroke="#0f172a" stroke-width="5"/><polygon points="720,395 740,395 730,415" fill="#0f172a"/>
<text x="590" y="450" font-family="Arial" font-size="21">Diandric triploidy → 69,XXY</text><text x="630" y="485" font-family="Arial" font-size="19">Maternal genome retained</text>
<text x="50" y="585" font-family="Arial,sans-serif" font-size="16" fill="#475569">AylaMed original teaching graphic — private research draft</text>
</svg>