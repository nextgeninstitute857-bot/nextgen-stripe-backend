<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Likelihood ratio and posttest probability workflow</title><desc id="d">Original AylaMed diagram with a two-by-two table and conversion from pretest probability to posttest probability.</desc><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#24324a"/></marker></defs><rect width="900" height="520" rx="28" fill="#f7fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#172033">Positive likelihood ratio: from test table to posttest probability</text><rect x="45" y="90" width="360" height="300" rx="18" fill="#ffffff" stroke="#c7d2df" stroke-width="2"/><text x="225" y="122" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Diagnostic study</text><line x1="95" y1="155" x2="365" y2="155" stroke="#24324a" stroke-width="2"/><line x1="95" y1="215" x2="365" y2="215" stroke="#24324a" stroke-width="2"/><line x1="95" y1="275" x2="365" y2="275" stroke="#24324a" stroke-width="2"/><line x1="95" y1="335" x2="365" y2="335" stroke="#24324a" stroke-width="2"/><line x1="95" y1="155" x2="95" y2="335" stroke="#24324a" stroke-width="2"/><line x1="185" y1="155" x2="185" y2="335" stroke="#24324a" stroke-width="2"/><line x1="275" y1="155" x2="275" y2="335" stroke="#24324a" stroke-width="2"/><line x1="365" y1="155" x2="365" y2="335" stroke="#24324a" stroke-width="2"/><text x="230" y="180" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700">Disease +</text><text x="320" y="180" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700">Disease −</text><text x="140" y="248" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">Test +</text><text x="230" y="248" text-anchor="middle" font-family="Arial" font-size="21">45</text><text x="320" y="248" text-anchor="middle" font-family="Arial" font-size="21">30</text><text x="140" y="308" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">Test −</text><text x="230" y="308" text-anchor="middle" font-family="Arial" font-size="21">5</text><text x="320" y="308" text-anchor="middle" font-family="Arial" font-size="21">120</text><text x="225" y="370" text-anchor="middle" font-family="Arial" font-size="17" fill="#425466">Sensitivity = 0.90   Specificity = 0.80</text><path d="M405 240 H470" stroke="#24324a" stroke-width="4" marker-end="url(#m)"/><rect x="480" y="92" width="375" height="300" rx="18" fill="#ffffff" stroke="#c7d2df" stroke-width="2"/><text x="668" y="125" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Bayes in odds form</text><text x="515" y="175" font-family="Arial" font-size="18" fill="#172033">LR+ = 0.90 ÷ (1 − 0.80) =</text><text x="800" y="175" text-anchor="end" font-family="Arial" font-size="22" font-weight="700" fill="#4f6fb3">4.5</text><text x="515" y="225" font-family="Arial" font-size="18" fill="#172033">Pretest odds = 0.20 ÷ 0.80 =</text><text x="800" y="225" text-anchor="end" font-family="Arial" font-size="22" font-weight="700" fill="#2d7a62">0.25</text><text x="515" y="275" font-family="Arial" font-size="18" fill="#172033">Posttest odds = 0.25 × 4.5 =</text><text x="800" y="275" text-anchor="end" font-family="Arial" font-size="22" font-weight="700" fill="#b65454">1.125</text><text x="515" y="325" font-family="Arial" font-size="18" fill="#172033">Probability = 1.125 ÷ 2.125 =</text><text x="800" y="325" text-anchor="end" font-family="Arial" font-size="25" font-weight="700" fill="#7651a8">53%</text><text x="450" y="455" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Pretest odds × likelihood ratio = posttest odds</text><text x="450" y="486" text-anchor="middle" font-family="Arial" font-size="16" fill="#425466">Then convert odds to probability: odds ÷ (1 + odds)</text></svg>