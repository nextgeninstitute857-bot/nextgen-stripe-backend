<svg xmlns="http://www.w3.org/2000/svg" width="940" height="600" viewBox="0 0 940 600" role="img" aria-labelledby="title desc">
  <title id="title">Audiogram with a 4 kilohertz noise notch</title>
  <desc id="desc">Original bilateral audiogram showing normal lower-frequency thresholds and a symmetric high-frequency notch near 4 kilohertz.</desc>
  <rect width="940" height="600" fill="#ffffff"/>
  <text x="470" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#173f4c">Pure-tone audiogram</text>
  <line x1="120" y1="95" x2="865" y2="95" stroke="#284b55" stroke-width="3"/>
  <line x1="120" y1="95" x2="120" y2="505" stroke="#284b55" stroke-width="3"/>
  <g stroke="#d7e5e8" stroke-width="1">
    <line x1="120" y1="145" x2="865" y2="145"/><line x1="120" y1="195" x2="865" y2="195"/><line x1="120" y1="245" x2="865" y2="245"/><line x1="120" y1="295" x2="865" y2="295"/><line x1="120" y1="345" x2="865" y2="345"/><line x1="120" y1="395" x2="865" y2="395"/><line x1="120" y1="445" x2="865" y2="445"/><line x1="120" y1="495" x2="865" y2="495"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#284b55">
    <text x="95" y="101" text-anchor="end">0</text><text x="95" y="151" text-anchor="end">10</text><text x="95" y="201" text-anchor="end">20</text><text x="95" y="251" text-anchor="end">30</text><text x="95" y="301" text-anchor="end">40</text><text x="95" y="351" text-anchor="end">50</text><text x="95" y="401" text-anchor="end">60</text><text x="95" y="451" text-anchor="end">70</text><text x="95" y="501" text-anchor="end">80</text>
    <text transform="translate(34 300) rotate(-90)" text-anchor="middle">Hearing threshold (dB HL; worse downward)</text>
    <text x="150" y="540" text-anchor="middle">250</text><text x="260" y="540" text-anchor="middle">500</text><text x="370" y="540" text-anchor="middle">1k</text><text x="480" y="540" text-anchor="middle">2k</text><text x="590" y="540" text-anchor="middle">3k</text><text x="700" y="540" text-anchor="middle">4k</text><text x="810" y="540" text-anchor="middle">8k</text>
    <text x="480" y="575" text-anchor="middle">Frequency (Hz)</text>
  </g>
  <polyline points="150,130 260,135 370,145 480,170 590,255 700,390 810,260" fill="none" stroke="#ba3e3e" stroke-width="6" stroke-linejoin="round"/>
  <polyline points="150,125 260,130 370,150 480,165 590,245 700,380 810,250" fill="none" stroke="#2f6f9d" stroke-width="6" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke-width="4">
    <g stroke="#ba3e3e"><circle cx="150" cy="130" r="8"/><circle cx="260" cy="135" r="8"/><circle cx="370" cy="145" r="8"/><circle cx="480" cy="170" r="8"/><circle cx="590" cy="255" r="8"/><circle cx="700" cy="390" r="8"/><circle cx="810" cy="260" r="8"/></g>
    <g stroke="#2f6f9d"><rect x="142" y="117" width="16" height="16"/><rect x="252" y="122" width="16" height="16"/><rect x="362" y="142" width="16" height="16"/><rect x="472" y="157" width="16" height="16"/><rect x="582" y="237" width="16" height="16"/><rect x="692" y="372" width="16" height="16"/><rect x="802" y="242" width="16" height="16"/></g>
  </g>
  <rect x="600" y="105" width="240" height="82" rx="14" fill="#fff4e5" stroke="#c47b13" stroke-width="2"/>
  <text x="720" y="137" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#8a5200">Symmetric 4-kHz notch</text>
  <text x="720" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#8a5200">Typical of acoustic trauma</text>
</svg>
