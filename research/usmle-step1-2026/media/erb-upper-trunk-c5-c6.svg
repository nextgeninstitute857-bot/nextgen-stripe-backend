<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Upper-trunk brachial plexus injury</title><desc id="desc">C5-C6 injury produces the waiter’s-tip posture</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".13"/></filter></defs><rect width="1000" height="620" rx="28" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Upper-trunk brachial plexus injury</text><text x="500" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">C5-C6 injury produces the waiter’s-tip posture</text><rect x="50" y="125" width="280" height="290" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/><text x="190.0" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Upper trunk</text><text x="190.0" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">C5 root</text><text x="190.0" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">C6 root</text><text x="190.0" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">Erb point</text><rect x="360" y="125" width="280" height="290" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/><text x="500.0" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Weak movements</text><text x="500.0" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">shoulder abduction</text><text x="500.0" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">external rotation</text><text x="500.0" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">elbow flexion</text><text x="500.0" y="259" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">supination</text><rect x="670" y="125" width="280" height="290" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/><text x="810.0" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Posture</text><text x="810.0" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">arm adducted</text><text x="810.0" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">internally rotated</text><text x="810.0" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">elbow extended</text><text x="810.0" y="259" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">forearm pronated</text><path d="M330 270 L360 270" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="345.0" y="262.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">injury</text><path d="M640 270 L670 270" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="655.0" y="262.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">causes</text><text x="500" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Lower-trunk function and hand grasp are usually preserved.</text></svg>