<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Minimal change disease pathology</title><desc id="d">Original three-panel comparison of normal light microscopy, negative immunofluorescence, and diffuse podocyte foot-process effacement.</desc><rect width="900" height="520" rx="28" fill="#f8fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Minimal change disease</text><g font-family="Arial"><rect x="45" y="95" width="250" height="300" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="170" y="130" text-anchor="middle" font-size="21" font-weight="700">Light microscopy</text><circle cx="170" cy="245" r="75" fill="#fde68a" stroke="#92400e" stroke-width="4"/><g stroke="#92400e" stroke-width="5"><path d="M115 210q55 70 110 0"/><path d="M110 255q60-70 120 0"/><path d="M125 285q45-55 90 0"/></g><text x="170" y="360" text-anchor="middle" font-size="18">essentially normal</text><rect x="325" y="95" width="250" height="300" rx="20" fill="#e2e8f0" stroke="#475569" stroke-width="3"/><text x="450" y="130" text-anchor="middle" font-size="21" font-weight="700">Immunofluorescence</text><circle cx="450" cy="245" r="75" fill="#0f172a"/><text x="450" y="252" text-anchor="middle" font-size="28" fill="#94a3b8">no deposits</text><text x="450" y="360" text-anchor="middle" font-size="18">negative</text><rect x="605" y="95" width="250" height="300" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="730" y="130" text-anchor="middle" font-size="21" font-weight="700">Electron microscopy</text><path d="M635 270h190" stroke="#475569" stroke-width="12"/><path d="M645 230q20 25 40 0t40 0t40 0t40 0" fill="none" stroke="#2563eb" stroke-width="18"/><path d="M650 200h160" stroke="#dc2626" stroke-width="8"/><text x="730" y="350" text-anchor="middle" font-size="18">diffuse foot-process effacement</text><text x="450" y="470" text-anchor="middle" font-size="18" fill="#475569">Podocyte permeability defect causes nephrotic proteinuria without immune deposits</text></g></svg>