<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">HSV encephalitis temporal lobe localization</title><desc id="d">Original axial brain schematic highlighting hemorrhagic inflammation in the temporal lobes and hippocampal regions typical of herpes simplex encephalitis.</desc><rect width="900" height="520" rx="28" fill="#f8fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">HSV encephalitis: temporal and limbic predilection</text><ellipse cx="450" cy="275" rx="300" ry="185" fill="#e2e8f0" stroke="#475569" stroke-width="5"/><path d="M450 105 C380 130 355 205 365 275 C375 355 410 405 450 440" fill="none" stroke="#64748b" stroke-width="4"/><path d="M450 105 C520 130 545 205 535 275 C525 355 490 405 450 440" fill="none" stroke="#64748b" stroke-width="4"/><ellipse cx="350" cy="320" rx="105" ry="70" fill="#fecaca" stroke="#dc2626" stroke-width="4"/><ellipse cx="550" cy="320" rx="105" ry="70" fill="#fecaca" stroke="#dc2626" stroke-width="4"/><ellipse cx="390" cy="285" rx="42" ry="26" fill="#ef4444"/><ellipse cx="510" cy="285" rx="42" ry="26" fill="#ef4444"/><g fill="#7f1d1d"><circle cx="315" cy="300" r="9"/><circle cx="345" cy="335" r="9"/><circle cx="575" cy="300" r="9"/><circle cx="545" cy="340" r="9"/></g><text x="240" y="455" font-family="Arial" font-size="17" fill="#991b1b">temporal lobe edema and hemorrhage</text><line x1="350" y1="390" x2="300" y2="440" stroke="#991b1b" stroke-width="3"/><text x="610" y="455" font-family="Arial" font-size="17" fill="#991b1b">hippocampal involvement</text><line x1="510" y1="285" x2="640" y2="430" stroke="#991b1b" stroke-width="3"/><rect x="55" y="95" width="230" height="100" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="170" y="132" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">Clinical clues</text><text x="170" y="165" text-anchor="middle" font-family="Arial" font-size="16">fever • seizures • behavior change</text></svg>