<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Osteoarthritis joint degeneration</title><desc id="desc">Cartilage catabolism and subchondral remodeling affect the whole joint</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".13"/></filter></defs><rect width="1000" height="620" rx="28" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Osteoarthritis joint degeneration</text><text x="500" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">Cartilage catabolism and subchondral remodeling affect the whole joint</text><rect x="50" y="125" width="280" height="290" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/><text x="190.0" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Articular cartilage</text><text x="190.0" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">type II collagen loss</text><text x="190.0" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">aggrecan depletion</text><text x="190.0" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">surface fissures</text><rect x="360" y="125" width="280" height="290" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/><text x="500.0" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Catabolic shift</text><text x="500.0" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">MMP activity</text><text x="500.0" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">ADAMTS aggrecanases</text><text x="500.0" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">chondrocyte stress</text><rect x="670" y="125" width="280" height="290" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/><text x="810.0" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Bone response</text><text x="810.0" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">joint-space narrowing</text><text x="810.0" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">subchondral sclerosis</text><text x="810.0" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">marginal osteophytes</text><path d="M330 270 L360 270" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="345.0" y="262.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">matrix breakdown</text><path d="M640 270 L670 270" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="655.0" y="262.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">remodeling</text><text x="500" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Osteoarthritis is not simply passive wear; chondrocyte catabolism and bone remodeling interact.</text></svg>