<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">IgA nephropathy — original AylaMed teaching diagram</title>
<desc id="desc">Connect galactose-deficient IgA1 and antiglycan antibodies to mesangial immune-complex deposition and synpharyngitic hematuria.</desc>
<style>
.bg{fill:#f7f9fc} .frame{fill:#fff;stroke:#26364a;stroke-width:2.5} .panel{fill:#fff;stroke:#315a8b;stroke-width:2}
.iconfill{fill:#e9f1ff;stroke:#315a8b;stroke-width:3} .icon{fill:none;stroke:#315a8b;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.alertfill{fill:#b13b3b} .title{font:700 34px Arial;fill:#172536} .subtitle{font:600 18px Arial;fill:#315a8b}
.body{font:18px Arial;fill:#172536} .small{font:600 14px Arial;fill:#5a6675}
.num{fill:#315a8b} .numtext{font:700 18px Arial;fill:#fff} .arrow{stroke:#315a8b;stroke-width:5} .arrowfill{fill:#315a8b}
</style>
<rect width="1200" height="720" class="bg"/>
<rect x="25" y="25" width="1150" height="670" rx="30" class="frame"/>
<text x="65" y="80" class="title">IgA nephropathy</text>
<text x="65" y="120" class="subtitle" text-anchor="start">Galactose-deficient IgA1 immune complexes</text>
<rect x="65" y="235" width="255" height="300" rx="22" fill="#e9f1ff" stroke="#315a8b" stroke-width="2"/>
<path d="M130 410 L190 285 L250 410 Z" class="iconfill"/><circle cx="190" cy="365" r="15" class="alertfill"/>
<text x="192" y="485" class="small" text-anchor="middle">ORIGINAL MECHANISM MAP</text>
<rect x="365" y="235" width="235" height="300" rx="22" class="panel"/><circle cx="403" cy="280" r="22" class="num"/><text x="403" y="287" class="numtext" text-anchor="middle">1</text><text x="390" y="345" class="body" text-anchor="start">Galactose-deficient IgA1</text><text x="390" y="372" class="body" text-anchor="start">is produced</text><path d="M605 385 H623" class="arrow"/><path d="M623 385 l-14 -10 v20 z" class="arrowfill"/><rect x="630" y="235" width="235" height="300" rx="22" class="panel"/><circle cx="668" cy="280" r="22" class="num"/><text x="668" y="287" class="numtext" text-anchor="middle">2</text><text x="655" y="345" class="body" text-anchor="start">Antiglycan antibodies form</text><text x="655" y="372" class="body" text-anchor="start">immune complexes</text><path d="M870 385 H888" class="arrow"/><path d="M888 385 l-14 -10 v20 z" class="arrowfill"/><rect x="895" y="235" width="235" height="300" rx="22" class="panel"/><circle cx="933" cy="280" r="22" class="num"/><text x="933" y="287" class="numtext" text-anchor="middle">3</text><text x="920" y="345" class="body" text-anchor="start">Mesangial deposition</text><text x="920" y="372" class="body" text-anchor="start">triggers hematuria</text>
<text x="600" y="650" class="small" text-anchor="middle">AylaMed original SVG • private research draft • not for publication</text>
