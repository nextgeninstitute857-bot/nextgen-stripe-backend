<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">IgA nephropathy four-hit pathway</title><desc id="d">Original pathway from galactose-deficient IgA1 to antiglycan antibodies, circulating complexes, and mesangial deposition.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#334155"/></marker></defs><rect width="900" height="520" rx="28" fill="#f8fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">IgA nephropathy: four-hit model</text><g font-family="Arial"><rect x="35" y="120" width="175" height="220" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="122" y="155" text-anchor="middle" font-size="20" font-weight="700">1</text><text x="122" y="195" text-anchor="middle" font-size="17">galactose-deficient</text><text x="122" y="220" text-anchor="middle" font-size="17">IgA1 produced</text><rect x="250" y="120" width="175" height="220" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="337" y="155" text-anchor="middle" font-size="20" font-weight="700">2</text><text x="337" y="195" text-anchor="middle" font-size="17">antiglycan</text><text x="337" y="220" text-anchor="middle" font-size="17">antibodies form</text><rect x="465" y="120" width="175" height="220" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="552" y="155" text-anchor="middle" font-size="20" font-weight="700">3</text><text x="552" y="195" text-anchor="middle" font-size="17">circulating immune</text><text x="552" y="220" text-anchor="middle" font-size="17">complexes assemble</text><rect x="680" y="120" width="175" height="220" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="767" y="155" text-anchor="middle" font-size="20" font-weight="700">4</text><text x="767" y="195" text-anchor="middle" font-size="17">mesangial deposition</text><text x="767" y="220" text-anchor="middle" font-size="17">and inflammation</text><circle cx="767" cy="278" r="38" fill="#86efac" stroke="#166534" stroke-width="4"/><path d="M210 230h35M425 230h35M640 230h35" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><text x="450" y="410" text-anchor="middle" font-size="18">synpharyngitic hematuria • normal complement • mesangial IgA</text><text x="450" y="468" text-anchor="middle" font-size="17" fill="#475569">The deposited immune complex—not isolated IgA production alone—drives glomerular injury</text></g></svg>