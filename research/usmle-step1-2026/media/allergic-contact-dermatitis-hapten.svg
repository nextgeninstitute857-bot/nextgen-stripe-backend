<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Allergic contact dermatitis</title><desc id="desc">Hapten sensitization followed by delayed T-cell inflammation</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".13"/></filter></defs><rect width="1000" height="620" rx="28" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Allergic contact dermatitis</text><text x="500" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">Hapten sensitization followed by delayed T-cell inflammation</text><rect x="50" y="130" width="260" height="260" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/><text x="180.0" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Sensitization</text><text x="180.0" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">hapten binds host protein</text><text x="180.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">skin APC captures antigen</text><text x="180.0" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">T cells are primed</text><rect x="370" y="130" width="260" height="260" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/><text x="500.0" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Re-exposure</text><text x="500.0" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">memory T cells recognize</text><text x="500.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">modified peptides</text><rect x="690" y="130" width="260" height="260" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/><text x="820.0" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">48-hour eruption</text><text x="820.0" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">cytokines recruit cells</text><text x="820.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">keratinocyte injury</text><text x="820.0" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">vesicular eczema</text><path d="M310 260 L370 260" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="340.0" y="252.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">first exposure</text><path d="M630 260 L690 260" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="660.0" y="252.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">delayed response</text><text x="500" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Nickel and similar haptens cause type IV rather than antibody-mediated hypersensitivity.</text></svg>