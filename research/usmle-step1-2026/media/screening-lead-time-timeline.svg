<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Lead-time bias timeline</title><desc id="d">Original AylaMed timeline showing earlier diagnosis by screening but the same date of cancer-related death.</desc><rect width="900" height="520" rx="28" fill="#f7fafc"/><text x="450" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#172033">Lead-time bias: diagnosis moves earlier, death does not</text><text x="80" y="150" font-family="Arial" font-size="20" font-weight="700" fill="#29437d">Screened group</text><line x1="210" y1="145" x2="810" y2="145" stroke="#4f6fb3" stroke-width="6"/><circle cx="340" cy="145" r="13" fill="#2d7a62"/><text x="340" y="115" text-anchor="middle" font-family="Arial" font-size="17" fill="#172033">Screen diagnosis</text><text x="340" y="178" text-anchor="middle" font-family="Arial" font-size="16" fill="#425466">age 62</text><circle cx="760" cy="145" r="13" fill="#b65454"/><text x="760" y="115" text-anchor="middle" font-family="Arial" font-size="17" fill="#172033">Cancer death</text><text x="760" y="178" text-anchor="middle" font-family="Arial" font-size="16" fill="#425466">age 70</text><path d="M340 205 H760" stroke="#2d7a62" stroke-width="4"/><path d="M340 197 v16 M760 197 v16" stroke="#2d7a62" stroke-width="4"/><text x="550" y="235" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#2d7a62">Observed survival from diagnosis = 8 years</text><text x="80" y="320" font-family="Arial" font-size="20" font-weight="700" fill="#8e4d1d">Unscreened group</text><line x1="210" y1="315" x2="810" y2="315" stroke="#b96c2f" stroke-width="6"/><circle cx="655" cy="315" r="13" fill="#b96c2f"/><text x="655" y="285" text-anchor="middle" font-family="Arial" font-size="17" fill="#172033">Symptom diagnosis</text><text x="655" y="348" text-anchor="middle" font-family="Arial" font-size="16" fill="#425466">age 67</text><circle cx="760" cy="315" r="13" fill="#b65454"/><text x="760" y="285" text-anchor="middle" font-family="Arial" font-size="17" fill="#172033">Cancer death</text><text x="760" y="348" text-anchor="middle" font-family="Arial" font-size="16" fill="#425466">age 70</text><path d="M655 375 H760" stroke="#b96c2f" stroke-width="4"/><path d="M655 367 v16 M760 367 v16" stroke="#b96c2f" stroke-width="4"/><text x="708" y="405" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#8e4d1d">Observed survival = 3 years</text><line x1="760" y1="70" x2="760" y2="430" stroke="#b65454" stroke-width="2" stroke-dasharray="8 7"/><text x="450" y="465" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Same mortality outcome; only the clock starts earlier in the screened group</text><text x="450" y="495" text-anchor="middle" font-family="Arial" font-size="16" fill="#425466">Evaluate disease-specific mortality, not survival measured from diagnosis alone.</text></svg>