<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Flecainide use-dependent QRS widening</title><desc id="d">Original schematic comparing QRS complexes at slow and fast heart rates to show greater sodium-channel blockade and conduction slowing with frequent depolarization.</desc><rect width="900" height="520" rx="28" fill="#f8fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Class IC use dependence</text><rect x="55" y="95" width="360" height="320" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="235" y="130" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Slower heart rate</text><path d="M85 270 L130 270 L145 245 L165 315 L190 210 L215 300 L235 270 L280 270 L295 245 L315 315 L340 210 L365 300 L395 270" fill="none" stroke="#2563eb" stroke-width="5"/><line x1="145" y1="350" x2="235" y2="350" stroke="#64748b" stroke-width="4"/><text x="190" y="380" text-anchor="middle" font-family="Arial" font-size="16">moderate QRS width</text><rect x="485" y="95" width="360" height="320" rx="20" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/><text x="665" y="130" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">Faster heart rate</text><path d="M510 270 L535 270 L550 245 L580 330 L625 195 L670 320 L700 270 L725 270 L740 245 L770 330 L815 195 L835 270" fill="none" stroke="#e11d48" stroke-width="5"/><line x1="550" y1="350" x2="700" y2="350" stroke="#64748b" stroke-width="4"/><text x="625" y="380" text-anchor="middle" font-family="Arial" font-size="16">greater QRS widening</text><rect x="250" y="435" width="400" height="55" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="450" y="469" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">Frequent depolarization traps more drug-bound Na⁺ channels</text></svg>