<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-labelledby="title desc">
<title id="title">Terminal complement membrane attack complex</title><desc id="desc">Classical and alternative pathways converge at C3 and C5, then C5b through C9 form a pore in a bacterial membrane.</desc>
<rect width="940" height="520" fill="#ffffff"/>
<text x="40" y="45" font-family="Arial" font-size="28" font-weight="700">Complement pathways converge on terminal lysis</text>
<rect x="70" y="105" width="210" height="65" rx="15" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/><text x="105" y="145" font-family="Arial" font-size="20">Classical pathway</text>
<rect x="70" y="210" width="210" height="65" rx="15" fill="#dcfce7" stroke="#166534" stroke-width="4"/><text x="100" y="250" font-family="Arial" font-size="20">Alternative pathway</text>
<path d="M280 137 C350 137 350 205 420 205" fill="none" stroke="#111827" stroke-width="5"/><path d="M280 242 C350 242 350 205 420 205" fill="none" stroke="#111827" stroke-width="5"/>
<circle cx="470" cy="205" r="55" fill="#fef3c7" stroke="#92400e" stroke-width="4"/><text x="443" y="214" font-family="Arial" font-size="25" font-weight="700">C3</text>
<path d="M525 205 H620" stroke="#111827" stroke-width="5"/>
<circle cx="670" cy="205" r="55" fill="#fee2e2" stroke="#991b1b" stroke-width="4"/><text x="643" y="214" font-family="Arial" font-size="25" font-weight="700">C5</text>
<path d="M670 260 V315" stroke="#111827" stroke-width="5"/>
<text x="570" y="345" font-family="Arial" font-size="20" font-weight="700">C5b + C6 + C7 + C8 + C9</text>
<rect x="540" y="390" width="300" height="55" fill="#fca5a5" stroke="#7f1d1d" stroke-width="4"/>
<g fill="#7c3aed"><rect x="620" y="365" width="18" height="100"/><rect x="650" y="365" width="18" height="100"/><rect x="680" y="365" width="18" height="100"/><rect x="710" y="365" width="18" height="100"/></g>
<text x="565" y="500" font-family="Arial" font-size="19">MAC pore disrupts bacterial membrane</text>
</svg>