<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Phenytoin saturable metabolism</title><desc id="d">Original AylaMed two-panel diagram showing Michaelis-Menten saturation of phenytoin metabolism and a steep increase in steady-state concentration near metabolic capacity.</desc><rect width="900" height="520" rx="28" fill="#f7fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#172033">Phenytoin: capacity-limited hepatic metabolism</text><rect x="45" y="82" width="390" height="370" rx="20" fill="#ffffff" stroke="#c7d2df" stroke-width="2"/><text x="240" y="116" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Metabolic rate vs concentration</text><line x1="95" y1="395" x2="390" y2="395" stroke="#24324a" stroke-width="3"/><line x1="95" y1="395" x2="95" y2="150" stroke="#24324a" stroke-width="3"/><path d="M110 380 C155 330 200 255 250 215 C300 175 345 165 385 162" fill="none" stroke="#4f6fb3" stroke-width="7"/><line x1="95" y1="160" x2="390" y2="160" stroke="#b65454" stroke-width="2" stroke-dasharray="8 6"/><text x="385" y="150" text-anchor="end" font-family="Arial" font-size="15" fill="#b65454">Vmax</text><text x="242" y="430" text-anchor="middle" font-family="Arial" font-size="17" fill="#172033">Serum concentration</text><text x="65" y="275" transform="rotate(-90 65 275)" text-anchor="middle" font-family="Arial" font-size="17" fill="#172033">Metabolic rate</text><text x="242" y="470" text-anchor="middle" font-family="Arial" font-size="16" fill="#425466">Enzymes approach full capacity</text><rect x="465" y="82" width="390" height="370" rx="20" fill="#ffffff" stroke="#c7d2df" stroke-width="2"/><text x="660" y="116" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Steady-state concentration vs dose</text><line x1="515" y1="395" x2="810" y2="395" stroke="#24324a" stroke-width="3"/><line x1="515" y1="395" x2="515" y2="150" stroke="#24324a" stroke-width="3"/><path d="M530 380 C600 360 650 330 690 280 C735 225 760 175 770 140" fill="none" stroke="#b65454" stroke-width="7"/><line x1="680" y1="395" x2="680" y2="290" stroke="#8392a5" stroke-width="2" stroke-dasharray="7 6"/><line x1="715" y1="395" x2="715" y2="247" stroke="#8392a5" stroke-width="2" stroke-dasharray="7 6"/><path d="M680 414 H715" stroke="#24324a" stroke-width="3"/><text x="698" y="436" text-anchor="middle" font-family="Arial" font-size="14" fill="#172033">small dose rise</text><path d="M790 290 V247" stroke="#24324a" stroke-width="3"/><text x="800" y="270" font-family="Arial" font-size="14" fill="#172033">large concentration rise</text><text x="662" y="430" text-anchor="middle" font-family="Arial" font-size="17" fill="#172033">Daily dose</text><text x="485" y="275" transform="rotate(-90 485 275)" text-anchor="middle" font-family="Arial" font-size="17" fill="#172033">Steady-state level</text><text x="660" y="470" text-anchor="middle" font-family="Arial" font-size="16" fill="#425466">Apparent clearance falls near saturation</text></svg>