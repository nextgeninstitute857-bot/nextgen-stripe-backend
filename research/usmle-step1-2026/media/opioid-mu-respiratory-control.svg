<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Ventilatory response to carbon dioxide</title><desc id="desc">Original graph comparing normal ventilation response with a markedly blunted response after a sedating exposure.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".14"/></filter></defs><rect width="900" height="520" rx="28" fill="#f8fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Ventilatory response to carbon dioxide</text><line x1="100" y1="420" x2="820" y2="420" stroke="#334155" stroke-width="3"/><line x1="100" y1="420" x2="100" y2="100" stroke="#334155" stroke-width="3"/><text x="450" y="475" text-anchor="middle" font-family="Arial" font-size="18">arterial CO₂ tension</text><text x="35" y="270" transform="rotate(-90 35 270)" text-anchor="middle" font-family="Arial" font-size="18">minute ventilation</text><path d="M140 385 C260 350 390 265 520 150 C620 90 720 75 790 70" fill="none" stroke="#2563eb" stroke-width="6"/><path d="M140 402 C300 390 470 355 620 300 C700 270 755 245 790 220" fill="none" stroke="#dc2626" stroke-width="6"/><text x="690" y="105" font-family="Arial" font-size="17" fill="#2563eb">baseline</text><text x="675" y="270" font-family="Arial" font-size="17" fill="#dc2626">after exposure</text><rect x="570" y="335" width="235" height="65" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/><text x="687.5" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Clinical pattern</text><text x="687.5" y="397" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">miosis • somnolence • bradypnea</text></svg>