<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" role="img" aria-labelledby="title desc"><title id="title">Potassium distribution in diabetic ketoacidosis and after insulin</title><desc id="desc">Original schematic showing potassium shifting from cells into extracellular fluid during insulin deficiency while urinary potassium loss depletes total body stores, followed by intracellular movement after insulin.</desc><rect width="820" height="520" fill="#fff"/><text x="125" y="45" font-family="Arial" font-size="24">Before insulin</text><text x="555" y="45" font-family="Arial" font-size="24">After insulin</text><circle cx="210" cy="245" r="105" fill="#edf4f8" stroke="#2d6f9b" stroke-width="4"/><circle cx="610" cy="245" r="105" fill="#edf4f8" stroke="#2d6f9b" stroke-width="4"/><text x="168" y="252" font-family="Arial" font-size="21">Cell K⁺ low</text><text x="560" y="252" font-family="Arial" font-size="21">Cell K⁺ rises</text><path d="M190 130 C190 82 325 90 360 150" fill="none" stroke="#a23d48" stroke-width="8" marker-end="url(#r)"/><text x="225" y="90" font-family="Arial" font-size="18">K⁺ shifts outward</text><path d="M725 185 C780 180 780 315 720 315" fill="none" stroke="#b86b31" stroke-width="8" marker-end="url(#o)"/><text x="675" y="345" font-family="Arial" font-size="18">Insulin → Na⁺/K⁺-ATPase</text><line x1="405" y1="90" x2="405" y2="415" stroke="#555" stroke-width="2" stroke-dasharray="10 8"/><path d="M140 380 C150 460 270 460 285 380" fill="none" stroke="#7d4c99" stroke-width="8" marker-end="url(#p)"/><text x="95" y="490" font-family="Arial" font-size="18">Osmotic diuresis removes K⁺: total body potassium is depleted</text><text x="495" y="455" font-family="Arial" font-size="18">Serum K⁺ may fall rapidly during treatment</text><defs><marker id="r" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#a23d48"/></marker><marker id="o" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#b86b31"/></marker><marker id="p" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#7d4c99"/></marker></defs></svg>