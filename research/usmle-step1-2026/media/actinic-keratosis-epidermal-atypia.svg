<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Actinic keratosis</title><desc id="desc">UV-associated keratinocyte atypia confined to the epidermis</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".13"/></filter></defs><rect width="1000" height="620" rx="28" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Actinic keratosis</text><text x="500" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">UV-associated keratinocyte atypia confined to the epidermis</text><rect x="55" y="120" width="270" height="300" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/><text x="190.0" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Sun-damaged epidermis</text><text x="190.0" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">parakeratosis</text><text x="190.0" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">lower-layer atypia</text><text x="190.0" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">disordered maturation</text><rect x="365" y="120" width="270" height="300" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/><text x="500.0" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Basement membrane</text><text x="500.0" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">intact in actinic keratosis</text><text x="500.0" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">no dermal invasion</text><rect x="675" y="120" width="270" height="300" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/><text x="810.0" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Potential progression</text><text x="810.0" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">full-thickness dysplasia</text><text x="810.0" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">invasive squamous carcinoma</text><path d="M325 270 L365 270" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="345.0" y="262.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">confined above</text><path d="M635 270 L675 270" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="655.0" y="262.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">can progress</text><text x="500" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Invasion through the basement membrane marks invasive squamous cell carcinoma.</text></svg>