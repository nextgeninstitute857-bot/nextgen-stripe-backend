<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc"><title id="title">Pressure-volume loops in normal physiology and aortic stenosis</title><desc id="desc">Original schematic comparing a normal left ventricular pressure-volume loop with a taller, narrower loop representing increased afterload in aortic stenosis.</desc><rect width="760" height="500" fill="#fff"/><line x1="90" y1="420" x2="690" y2="420" stroke="#111" stroke-width="3"/><line x1="90" y1="420" x2="90" y2="55" stroke="#111" stroke-width="3"/><text x="350" y="475" font-family="Arial" font-size="22">Left ventricular volume</text><text x="25" y="285" font-family="Arial" font-size="22" transform="rotate(-90 25 285)">Left ventricular pressure</text><path d="M250 380 L250 190 C250 120 390 105 475 190 L475 380 C410 405 315 405 250 380 Z" fill="none" stroke="#2f6f9f" stroke-width="7"/><path d="M340 390 L340 105 C340 55 490 50 540 130 L540 390 C485 408 400 410 340 390 Z" fill="none" stroke="#b8423a" stroke-width="7"/><text x="195" y="155" font-family="Arial" font-size="21" fill="#2f6f9f">Normal</text><text x="505" y="90" font-family="Arial" font-size="21" fill="#b8423a">Aortic stenosis</text><line x1="520" y1="205" x2="650" y2="205" stroke="#b8423a" stroke-width="3" marker-end="url(#a)"/><text x="545" y="190" font-family="Arial" font-size="18">Higher systolic pressure</text><line x1="338" y1="435" x2="255" y2="435" stroke="#333" stroke-width="3" marker-end="url(#a)"/><text x="260" y="458" font-family="Arial" font-size="17">Higher ESV; lower stroke volume</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker></defs></svg>