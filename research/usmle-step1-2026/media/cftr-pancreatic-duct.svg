<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">CFTR pancreatic duct transport schematic</title><desc id="desc">Original AylaMed educational schematic. Not derived from proprietary question-bank media.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#23395d"/></marker><style>.t{font:20px Arial,sans-serif;fill:#172033}.s{font:16px Arial,sans-serif;fill:#172033}.b{fill:#eef4ff;stroke:#23395d;stroke-width:3}.r{fill:#fff1f1;stroke:#8a2432;stroke-width:3}.g{fill:#eef9f0;stroke:#2d6a3f;stroke-width:3}.ln{stroke:#23395d;stroke-width:4;fill:none;marker-end:url(#arrow)}</style></defs><rect width="960" height="560" fill="white"/><text x="40" y="45" class="t">Pancreatic duct bicarbonate secretion</text><rect x="90" y="110" width="300" height="300" rx="20" class="b"/><text x="170" y="145" class="t">Duct cell</text><text x="20" y="250" class="s">Blood</text><text x="780" y="250" class="s">Duct lumen</text><line x1="390" y1="180" x2="390" y2="360" stroke="#23395d" stroke-width="5"/><rect x="360" y="205" width="60" height="70" class="g"/><text x="365" y="247" class="s">CFTR</text><path d="M420 225 L690 225" class="ln"/><text x="520" y="205" class="s">Cl⁻ / HCO₃⁻</text><rect x="360" y="305" width="60" height="70" class="b"/><text x="367" y="347" class="s">Cl/HCO₃</text><path d="M420 340 L690 340" class="ln"/><text x="510" y="320" class="s">HCO₃⁻ secretion</text><path d="M700 270 L820 270" class="ln"/><text x="710" y="250" class="s">Water follows</text><rect x="510" y="430" width="360" height="70" rx="12" class="r"/><text x="535" y="460" class="s">CFTR loss → low-flow acidic secretion</text><text x="555" y="486" class="s">→ duct obstruction and enzyme loss</text><text x="30" y="535" class="s">AylaMed original teaching graphic • private research draft</text></svg>