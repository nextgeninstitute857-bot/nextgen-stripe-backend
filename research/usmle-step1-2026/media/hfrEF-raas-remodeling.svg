ily="Arial" font-size="20" font-weight="700">Chronic consequences</text><text x="557" y="400" text-anchor="middle" font-family="Arial" font-size="17">afterload ↑ • preload ↑ • fibrosis • adverse ventricular remodeling</text><path d="M695 235 L650 320" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><path d="M285 385 C210 390 190 320 180 300" fill="none" stroke="#e11d48" stroke-width="4" marker-end="url(#a)"/><text x="180" y="405" font-family="Arial" font-size="15" fill="#9f1239">vicious cycle</text></svg>