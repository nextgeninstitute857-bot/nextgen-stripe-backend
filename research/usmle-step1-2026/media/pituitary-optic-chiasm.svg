<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Pituitary macroadenoma and the optic chiasm</title><desc id="desc">Superior sellar expansion compresses crossing nasal retinal fibers</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".13"/></filter></defs><rect width="1000" height="620" rx="28" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Pituitary macroadenoma and the optic chiasm</text><text x="500" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">Superior sellar expansion compresses crossing nasal retinal fibers</text><rect x="45" y="135" width="280" height="250" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/><text x="185.0" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Sellar mass</text><text x="185.0" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">pituitary macroadenoma</text><text x="185.0" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">superior extension</text><rect x="360" y="135" width="280" height="250" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/><text x="500.0" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Optic chiasm</text><text x="500.0" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">nasal retinal fibers cross</text><text x="500.0" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">temporal fields represented</text><rect x="675" y="135" width="280" height="250" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/><text x="815.0" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Field defect</text><text x="815.0" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">left temporal loss</text><text x="815.0" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">right temporal loss</text><text x="815.0" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">bitemporal pattern</text><path d="M325 260 L360 260" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="342.5" y="252.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">compresses</text><path d="M640 260 L675 260" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="657.5" y="252.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">causes</text><text x="500" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Asymmetric or extensive compression can create mixed defects, but the classic localization is the chiasm.</text></svg>