<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><style>text{font-family:Arial;fill:#172536}.t{font-size:34px;font-weight:700}.h{font-size:22px;font-weight:700;fill:#315a8b}.b{font-size:19px}.p{fill:#fff;stroke:#26364a;stroke-width:2}.a{fill:#e9f1ff;stroke:#315a8b;stroke-width:2}.r{stroke:#b13b3b;stroke-width:7;fill:none}</style><rect width="1200" height="720" fill="#f7f9fc"/><text x="60" y="70" class="t">Pheochromocytoma: blockade sequence</text><rect x="70" y="170" width="300" height="330" rx="25" class="a"/><text x="140" y="240" class="h">1. Alpha blockade</text><text x="110" y="300" class="b">Control vasoconstriction</text><text x="105" y="345" class="b">Restore intravascular volume</text><path d="M370 335 H500" class="r"/><rect x="500" y="170" width="300" height="330" rx="25" class="p"/><text x="570" y="240" class="h">2. Beta blockade</text><text x="545" y="300" class="b">Only if tachycardia persists</text><path d="M800 335 H930" class="r"/><rect x="930" y="170" width="210" height="330" rx="25" class="a"/><text x="975" y="240" class="h">Surgery</text><text x="950" y="300" class="b">Avoid unopposed alpha</text></svg>