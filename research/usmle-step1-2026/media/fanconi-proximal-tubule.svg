<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Generalized proximal-tubule dysfunction</title><desc id="desc">Fanconi syndrome causes loss of multiple filtered solutes</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".13"/></filter></defs><rect width="1000" height="620" rx="28" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Generalized proximal-tubule dysfunction</text><text x="500" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">Fanconi syndrome causes loss of multiple filtered solutes</text><rect x="50" y="135" width="280" height="250" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/><text x="190.0" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Filtered solutes</text><text x="190.0" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">glucose</text><text x="190.0" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">amino acids</text><text x="190.0" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">phosphate</text><text x="190.0" y="269" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">bicarbonate</text><rect x="360" y="135" width="280" height="250" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/><text x="500.0" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Proximal tubule</text><text x="500.0" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">sodium-linked reabsorption</text><text x="500.0" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">global transport failure</text><rect x="670" y="135" width="280" height="250" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/><text x="810.0" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Urinary losses</text><text x="810.0" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">normoglycemic glucosuria</text><text x="810.0" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">phosphaturia</text><text x="810.0" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">type 2 RTA</text><path d="M330 260 L360 260" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="345.0" y="252.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">normally reabsorbed</text><path d="M640 260 L670 260" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="655.0" y="252.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">Fanconi</text><text x="500" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">A multi-solute pattern localizes the defect to the proximal tubule.</text></svg>