<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Internuclear ophthalmoplegia horizontal gaze circuit</title><desc id="desc">Original AylaMed educational schematic. Not derived from proprietary question-bank media.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#23395d"/></marker><style>.t{font:20px Arial,sans-serif;fill:#172033}.s{font:16px Arial,sans-serif;fill:#172033}.b{fill:#eef4ff;stroke:#23395d;stroke-width:3}.r{fill:#fff1f1;stroke:#8a2432;stroke-width:3}.g{fill:#eef9f0;stroke:#2d6a3f;stroke-width:3}.ln{stroke:#23395d;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#8a2432;stroke-width:4;fill:none;stroke-dasharray:10 8}</style></defs><rect width="960" height="560" fill="white"/><text x="40" y="45" class="t">Rightward gaze and left internuclear ophthalmoplegia</text><circle cx="220" cy="170" r="70" class="b"/><text x="175" y="175" class="t">Left eye</text><circle cx="740" cy="170" r="70" class="b"/><text x="690" y="175" class="t">Right eye</text><rect x="610" y="310" width="220" height="80" rx="15" class="g"/><text x="635" y="345" class="t">Right abducens</text><text x="680" y="375" class="s">nucleus</text><rect x="130" y="310" width="220" height="80" rx="15" class="b"/><text x="155" y="345" class="t">Left oculomotor</text><text x="175" y="375" class="s">medial rectus</text><path d="M720 310 L740 240" class="ln"/><text x="745" y="270" class="s">abduct</text><path d="M610 350 C500 350,470 350,350 350" class="ln"/><line x1="445" y1="320" x2="515" y2="380" stroke="#8a2432" stroke-width="10"/><line x1="515" y1="320" x2="445" y2="380" stroke="#8a2432" stroke-width="10"/><text x="420" y="415" class="s">Left MLF lesion</text><path d="M240 310 L220 240" class="dash"/><text x="120" y="270" class="s">adduction fails</text><text x="550" y="475" class="s">Right eye abducts with nystagmus</text><text x="90" y="475" class="s">Convergence can remain intact</text><text x="30" y="535" class="s">AylaMed original teaching graphic • private research draft</text></svg>