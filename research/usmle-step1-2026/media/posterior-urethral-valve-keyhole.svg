<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Posterior urethral valve obstruction</title><desc id="desc">Male fetal bladder outlet obstruction with upper-tract pressure injury</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".13"/></filter></defs><rect width="1000" height="620" rx="28" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Posterior urethral valve obstruction</text><text x="500" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">Male fetal bladder outlet obstruction with upper-tract pressure injury</text><rect x="55" y="120" width="260" height="280" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/><text x="185.0" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Upper urinary tract</text><text x="185.0" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">bilateral hydronephrosis</text><text x="185.0" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">hydroureter</text><text x="185.0" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">renal dysplasia risk</text><rect x="370" y="120" width="260" height="280" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/><text x="500.0" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Bladder and outlet</text><text x="500.0" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">thick-walled bladder</text><text x="500.0" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">dilated posterior urethra</text><text x="500.0" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">keyhole configuration</text><rect x="685" y="120" width="260" height="280" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/><text x="815.0" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Fetal consequences</text><text x="815.0" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">reduced urine output</text><text x="815.0" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">oligohydramnios</text><text x="815.0" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">pulmonary hypoplasia</text><path d="M315 260 L370 260" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="342.5" y="252.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">back pressure</text><path d="M630 260 L685 260" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="657.5" y="252.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">severe obstruction</text><text x="500" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Obstructing posterior urethral folds occur in male fetuses and raise intravesical pressure.</text></svg>