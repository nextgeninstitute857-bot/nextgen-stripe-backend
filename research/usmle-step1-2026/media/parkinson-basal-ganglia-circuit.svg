<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Parkinson basal ganglia circuit schematic</title><desc id="desc">Original AylaMed educational schematic. Not derived from proprietary question-bank media.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#23395d"/></marker><style>.t{font:20px Arial,sans-serif;fill:#172033}.s{font:16px Arial,sans-serif;fill:#172033}.b{fill:#eef4ff;stroke:#23395d;stroke-width:3}.r{fill:#fff1f1;stroke:#8a2432;stroke-width:3}.g{fill:#eef9f0;stroke:#2d6a3f;stroke-width:3}.ln{stroke:#23395d;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke:#8a2432;stroke-width:4;fill:none;stroke-dasharray:10 8}</style></defs><rect width="960" height="560" fill="white"/><text x="40" y="45" class="t">Parkinson disease: net basal-ganglia effect</text><rect x="60" y="100" width="170" height="80" rx="15" class="r"/><text x="85" y="135" class="t">SNc dopamine</text><text x="110" y="165" class="s">decreased</text><rect x="330" y="80" width="180" height="80" rx="15" class="b"/><text x="365" y="125" class="t">D1 direct</text><rect x="330" y="210" width="180" height="80" rx="15" class="b"/><text x="355" y="255" class="t">D2 indirect</text><rect x="590" y="210" width="150" height="80" rx="15" class="g"/><text x="625" y="255" class="t">STN ↑</text><rect x="590" y="80" width="150" height="80" rx="15" class="r"/><text x="620" y="125" class="t">GPi ↑</text><rect x="790" y="80" width="130" height="80" rx="15" class="b"/><text x="815" y="125" class="t">Thalamus</text><path d="M230 125 L330 120" class="dash"/><text x="250" y="100" class="s">less D1 drive</text><path d="M230 155 L330 235" class="dash"/><text x="230" y="220" class="s">less D2 inhibition</text><path d="M510 250 L590 250" class="ln"/><path d="M665 210 L665 160" class="ln"/><path d="M740 120 L790 120" class="ln"/><text x="750" y="100" class="s">GABA ↑</text><path d="M850 160 L850 360" class="dash"/><rect x="700" y="370" width="220" height="80" rx="15" class="r"/><text x="735" y="405" class="t">Motor cortex drive ↓</text><text x="765" y="435" class="s">bradykinesia</text><text x="150" y="500" class="s">Net: reduced direct pathway + enhanced indirect pathway → increased GPi inhibition of thalamus</text><text x="30" y="535" class="s">AylaMed original teaching graphic • private research draft</text></svg>