<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Gout NLRP3 inflammasome activation</title><desc id="d">Original schematic showing monosodium urate crystals entering a macrophage, NLRP3 inflammasome assembly, caspase-1 activation, IL-1 beta release, and neutrophil recruitment.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#334155"/></marker></defs><rect width="900" height="520" rx="28" fill="#f8fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Acute gout: crystal-triggered innate inflammation</text><rect x="45" y="130" width="220" height="230" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="155" y="165" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Monosodium urate</text><g fill="#93c5fd" stroke="#1d4ed8" stroke-width="3"><polygon points="100,220 130,190 145,245 115,275"/><polygon points="165,205 195,180 210,235 180,265"/></g><text x="155" y="325" text-anchor="middle" font-family="Arial" font-size="16">needle-shaped crystals</text><path d="M265 245 L345 245" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><rect x="345" y="95" width="245" height="320" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="467" y="130" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Macrophage</text><circle cx="467" cy="250" r="105" fill="#fed7aa" stroke="#c2410c" stroke-width="4"/><rect x="405" y="200" width="125" height="50" rx="14" fill="#f97316"/><text x="467" y="231" text-anchor="middle" font-family="Arial" font-size="16" fill="white">NLRP3</text><rect x="405" y="270" width="125" height="50" rx="14" fill="#fb923c"/><text x="467" y="301" text-anchor="middle" font-family="Arial" font-size="16">caspase-1</text><text x="467" y="370" text-anchor="middle" font-family="Arial" font-size="16">pro–IL-1β → IL-1β</text><path d="M590 245 L655 245" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><rect x="655" y="130" width="200" height="230" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="755" y="165" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Neutrophils</text><g fill="#fca5a5" stroke="#b91c1c" stroke-width="3"><circle cx="720" cy="240" r="38"/><circle cx="785" cy="235" r="38"/></g><text x="755" y="320" text-anchor="middle" font-family="Arial" font-size="16">painful acute synovitis</text></svg>