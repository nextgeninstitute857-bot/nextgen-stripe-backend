<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc"><title id="title">Dual atrioventricular nodal pathway reentry</title><desc id="desc">Original diagram showing a premature atrial impulse blocked in a refractory fast pathway, conducting down a slow pathway, then returning retrogradely through the recovered fast pathway.</desc><rect width="800" height="520" fill="#fff"/><circle cx="400" cy="70" r="36" fill="#e7eef7" stroke="#222" stroke-width="3"/><text x="377" y="78" font-family="Arial" font-size="20">Atrium</text><circle cx="400" cy="450" r="42" fill="#e7eef7" stroke="#222" stroke-width="3"/><text x="366" y="457" font-family="Arial" font-size="20">His bundle</text><path d="M370 105 C245 180 245 315 365 410" fill="none" stroke="#2d6f9b" stroke-width="10" marker-end="url(#b)"/><path d="M430 105 C560 185 555 320 435 410" fill="none" stroke="#a23d48" stroke-width="10" marker-end="url(#r)"/><path d="M450 390 C560 315 565 195 445 120" fill="none" stroke="#a23d48" stroke-width="5" stroke-dasharray="12 10" marker-end="url(#r)"/><line x1="330" y1="135" x2="370" y2="175" stroke="#111" stroke-width="9"/><line x1="370" y1="135" x2="330" y2="175" stroke="#111" stroke-width="9"/><text x="110" y="220" font-family="Arial" font-size="21" fill="#2d6f9b">Fast pathway</text><text x="92" y="248" font-family="Arial" font-size="17">rapid conduction, long refractory period</text><text x="545" y="230" font-family="Arial" font-size="21" fill="#a23d48">Slow pathway</text><text x="535" y="258" font-family="Arial" font-size="17">slow conduction, short refractory period</text><text x="215" y="495" font-family="Arial" font-size="18">Premature impulse: fast pathway blocked → slow antegrade → fast retrograde</text><defs><marker id="b" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#2d6f9b"/></marker><marker id="r" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#a23d48"/></marker></defs></svg>