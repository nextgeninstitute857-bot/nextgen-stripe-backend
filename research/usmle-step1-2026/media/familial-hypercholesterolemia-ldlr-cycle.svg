<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Hepatic LDL receptor cycle</title><desc id="d">Original diagram of LDL binding, endocytosis, lysosomal cholesterol release, and receptor recycling.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#334155"/></marker></defs><rect width="900" height="520" rx="28" fill="#f8fafc"/><text x="450" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Hepatic LDL receptor cycle</text><circle cx="125" cy="230" r="55" fill="#f59e0b"/><text x="125" y="236" text-anchor="middle" font-family="Arial" font-size="20">LDL</text><path d="M260 155v150" stroke="#0f766e" stroke-width="18"/><path d="M210 210q50-70 100 0" fill="none" stroke="#0f766e" stroke-width="10"/><text x="260" y="335" text-anchor="middle" font-family="Arial" font-size="18">LDL receptor</text><rect x="390" y="150" width="170" height="150" rx="70" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="475" y="230" text-anchor="middle" font-family="Arial" font-size="19">Endosome</text><rect x="650" y="150" width="170" height="150" rx="60" fill="#fee2e2" stroke="#dc2626" stroke-width="4"/><text x="735" y="220" text-anchor="middle" font-family="Arial" font-size="19">Lysosome</text><text x="735" y="250" text-anchor="middle" font-family="Arial" font-size="16">cholesterol release</text><path d="M180 230h65M310 230h75M560 230h85" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><path d="M475 305q-20 130-190 80" fill="none" stroke="#0f766e" stroke-width="5" marker-end="url(#a)"/><text x="440" y="405" text-anchor="middle" font-family="Arial" font-size="18">receptor recycling</text><text x="450" y="478" text-anchor="middle" font-family="Arial" font-size="17" fill="#475569">Familial hypercholesterolemia: impaired binding, internalization, or recycling reduces LDL clearance</text></svg>