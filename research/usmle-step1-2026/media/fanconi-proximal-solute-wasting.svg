<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Fanconi syndrome</title><desc id="desc">Original AylaMed teaching schematic: proximal tubule dysfunction; glucose + amino acids lost; phosphate loss; bicarbonate loss -&gt; type 2 RTA.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".14"/></filter></defs><rect width="900" height="520" rx="28" fill="#f8fafc"/><text x="450" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#0f172a">Fanconi syndrome</text><text x="450" y="82" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#475569">AylaMed original mechanism-first schematic</text><rect x="55" y="150" width="160" height="95" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3" filter="url(#shadow)"/><text x="135" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#78350f">proximal tubule</text><text x="135" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#78350f">dysfunction</text><path d="M215 197 C240 197 240 322 265 322" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="265" y="275" width="160" height="95" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3" filter="url(#shadow)"/><text x="345" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#78350f">glucose + amino acids</text><text x="345" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#78350f">lost</text><path d="M425 322 C450 322 450 197 475 197" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="475" y="150" width="160" height="95" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3" filter="url(#shadow)"/><text x="555" y="188" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#78350f">phosphate loss</text><path d="M635 197 C660 197 660 322 685 322" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="685" y="275" width="160" height="95" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="3" filter="url(#shadow)"/><text x="765" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#78350f">bicarbonate loss -&gt;</text><text x="765" y="333" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#78350f">type 2 RTA</text><circle cx="180" cy="440" r="10" fill="#d97706" opacity="0.35"/><circle cx="315" cy="440" r="15" fill="#d97706" opacity="0.47"/><circle cx="450" cy="440" r="20" fill="#d97706" opacity="0.59"/><circle cx="585" cy="440" r="10" fill="#d97706" opacity="0.71"/><circle cx="720" cy="440" r="15" fill="#d97706" opacity="0.83"/></svg>