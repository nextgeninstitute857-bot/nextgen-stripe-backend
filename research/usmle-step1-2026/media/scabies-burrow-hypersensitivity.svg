<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Scabies burrow and immune response</title><desc id="desc">Mites remain superficial while host hypersensitivity causes intense pruritus</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".13"/></filter></defs><rect width="1000" height="620" rx="28" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Scabies burrow and immune response</text><text x="500" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">Mites remain superficial while host hypersensitivity causes intense pruritus</text><rect x="50" y="135" width="280" height="250" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/><text x="190.0" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Stratum corneum</text><text x="190.0" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">female mite burrow</text><text x="190.0" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">eggs</text><text x="190.0" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">fecal pellets</text><rect x="360" y="135" width="280" height="250" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/><text x="500.0" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Antigen exposure</text><text x="500.0" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">mite proteins</text><text x="500.0" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">fecal antigens</text><text x="500.0" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">immune sensitization</text><rect x="670" y="135" width="280" height="250" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/><text x="810.0" y="167" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Clinical response</text><text x="810.0" y="197" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">delayed hypersensitivity</text><text x="810.0" y="221" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">nocturnal pruritus</text><text x="810.0" y="245" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">papules and excoriations</text><path d="M330 260 L360 260" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="345.0" y="252.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">releases</text><path d="M640 260 L670 260" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="655.0" y="252.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">elicits</text><text x="500" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Definitive diagnosis can identify mites, eggs, or feces from a burrow.</text></svg>