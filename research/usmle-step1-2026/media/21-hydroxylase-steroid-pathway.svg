<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" role="img" aria-labelledby="title desc"><title id="title">Simplified adrenal steroid pathway in 21-hydroxylase deficiency</title><desc id="desc">Original pathway diagram showing blocked cortisol and aldosterone synthesis, increased ACTH, accumulation of 17-hydroxyprogesterone, and diversion toward adrenal androgens.</desc><rect width="860" height="540" fill="#fff"/><rect x="335" y="40" width="190" height="55" rx="12" fill="#edf4f8" stroke="#333" stroke-width="3"/><text x="370" y="75" font-family="Arial" font-size="21">Cholesterol</text><line x1="430" y1="95" x2="430" y2="145" stroke="#333" stroke-width="4" marker-end="url(#a)"/><rect x="305" y="150" width="250" height="58" rx="12" fill="#edf4f8" stroke="#333" stroke-width="3"/><text x="323" y="186" font-family="Arial" font-size="20">Progesterone / 17-OHP</text><path d="M350 208 C245 265 225 325 205 395" fill="none" stroke="#2d6f9b" stroke-width="6" marker-end="url(#b)"/><path d="M510 208 C615 265 640 325 660 395" fill="none" stroke="#a23d48" stroke-width="6" marker-end="url(#r)"/><line x1="245" y1="278" x2="305" y2="338" stroke="#111" stroke-width="11"/><line x1="305" y1="278" x2="245" y2="338" stroke="#111" stroke-width="11"/><text x="80" y="285" font-family="Arial" font-size="19">21-hydroxylase block</text><rect x="90" y="405" width="220" height="62" rx="12" fill="#eaf1f8" stroke="#2d6f9b" stroke-width="3"/><text x="115" y="443" font-family="Arial" font-size="20">Cortisol and aldosterone ↓</text><rect x="550" y="405" width="220" height="62" rx="12" fill="#faecee" stroke="#a23d48" stroke-width="3"/><text x="593" y="443" font-family="Arial" font-size="20">Androgens ↑</text><path d="M200 475 C250 520 610 520 660 475" fill="none" stroke="#7d4c99" stroke-width="4" marker-end="url(#p)"/><text x="325" y="515" font-family="Arial" font-size="19">Low cortisol → ACTH ↑ → adrenal hyperplasia</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#333"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2d6f9b"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a23d48"/></marker><marker id="p" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7d4c99"/></marker></defs></svg>