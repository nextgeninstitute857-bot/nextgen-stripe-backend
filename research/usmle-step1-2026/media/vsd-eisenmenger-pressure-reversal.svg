<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">VSD shunt reversal</title><desc id="d">Original comparison of early left-to-right VSD flow and late right-to-left Eisenmenger flow.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#334155"/></marker></defs><rect width="900" height="520" rx="28" fill="#f8fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Large VSD: pressure-driven shunt reversal</text><rect x="55" y="90" width="365" height="330" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="238" y="125" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Childhood</text><circle cx="155" cy="240" r="70" fill="#fca5a5"/><circle cx="320" cy="240" r="70" fill="#93c5fd"/><text x="155" y="247" text-anchor="middle" font-family="Arial" font-size="21">LV</text><text x="320" y="247" text-anchor="middle" font-family="Arial" font-size="21">RV</text><path d="M225 240h25" stroke="#334155" stroke-width="6"/><path d="M220 220h80" stroke="#dc2626" stroke-width="9" marker-end="url(#a)"/><text x="238" y="350" text-anchor="middle" font-family="Arial" font-size="17">SVR &gt; PVR: left-to-right flow</text><rect x="480" y="90" width="365" height="330" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="663" y="125" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700">Eisenmenger stage</text><circle cx="580" cy="240" r="70" fill="#fca5a5"/><circle cx="745" cy="240" r="70" fill="#93c5fd"/><text x="580" y="247" text-anchor="middle" font-family="Arial" font-size="21">LV</text><text x="745" y="247" text-anchor="middle" font-family="Arial" font-size="21">RV</text><path d="M650 240h25" stroke="#334155" stroke-width="6"/><path d="M700 220h-80" stroke="#2563eb" stroke-width="9" marker-end="url(#a)"/><text x="663" y="340" text-anchor="middle" font-family="Arial" font-size="17">remodeled pulmonary arterioles</text><text x="663" y="368" text-anchor="middle" font-family="Arial" font-size="17">PVR &gt; SVR: right-to-left flow</text><text x="450" y="475" text-anchor="middle" font-family="Arial" font-size="18" fill="#475569">Chronic pulmonary overcirculation produces medial hypertrophy and intimal proliferation</text></svg>