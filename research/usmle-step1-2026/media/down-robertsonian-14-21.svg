<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Robertsonian translocation 14;21 — original AylaMed teaching diagram</title>
<desc id="desc">Derivative chromosome carries 14q + 21q. Derivative + normal 21 gamete → trisomy 21q.</desc>
<style>
.bg{fill:#f7f9fc}.panel{fill:#fff;stroke:#26364a;stroke-width:2}.accent{fill:#e9f1ff;stroke:#315a8b;stroke-width:2}
.title{font:700 34px Arial;fill:#172536}.subtitle{font:700 21px Arial;fill:#315a8b}.body{font:18px Arial;fill:#172536}.small{font:600 15px Arial;fill:#5a6675}
</style>
<rect width="1200" height="720" class="bg"/>
<rect x="30" y="30" width="1140" height="660" rx="28" class="panel"/>
<text x="70" y="90" class="title">Robertsonian translocation 14;21</text>
<text x="70" y="135" class="small">Original mechanism-focused Step 1 teaching graphic</text>
<rect x="70" y="180" width="310" height="390" rx="24" class="accent"/>
<path d="M155 230 L210 335 L155 440 M295 230 L240 335 L295 440" fill="none" stroke="#315a8b" stroke-width="18" stroke-linecap="round"/><path d="M205 235 L250 330 L205 430 M300 235 L255 330 L300 430" fill="none" stroke="#a13d3d" stroke-width="12" stroke-linecap="round"/><text x="225" y="485" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#315a8b">rob(14;21)</text>
<rect x="420" y="180" width="330" height="390" rx="24" class="panel"/>
<text x="470" y="230" class="subtitle">Mechanism</text><text x="470" y="285" class="body">Derivative chromosome</text><text x="470" y="319" class="body">carries 14q + 21q</text>
<path d="M755 375 H805" stroke="#315a8b" stroke-width="7"/><path d="M805 375 l-20 -14 v28 z" fill="#315a8b"/>
<rect x="820" y="180" width="310" height="390" rx="24" class="panel"/>
<text x="840" y="230" class="subtitle">Key inference</text><text x="840" y="285" class="body">Derivative + normal 21</text><text x="840" y="319" class="body">gamete → trisomy 21q</text>
<text x="600" y="645" text-anchor="middle" class="small">AylaMed original SVG — private research draft — publication blocked</text>
