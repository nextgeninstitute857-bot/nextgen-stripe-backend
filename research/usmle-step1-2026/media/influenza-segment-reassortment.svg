<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Influenza A genome reassortment</title><desc id="d">Original AylaMed diagram showing two segmented influenza viruses coinfecting a cell and producing a progeny virus with segments from both parents.</desc><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#24324a"/></marker></defs><rect width="900" height="520" rx="28" fill="#f7fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#172033">Influenza A: reassortment of segmented RNA genomes</text><circle cx="170" cy="180" r="92" fill="#e6f1ff" stroke="#426aa8" stroke-width="4"/><text x="170" y="83" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#29437d">Parent A</text><circle cx="730" cy="180" r="92" fill="#fff0e6" stroke="#b96c2f" stroke-width="4"/><text x="730" y="83" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#8e4d1d">Parent B</text><g stroke-width="8" stroke-linecap="round"><path d="M125 135 h38" stroke="#426aa8"/><path d="M177 135 h38" stroke="#426aa8"/><path d="M125 165 h38" stroke="#426aa8"/><path d="M177 165 h38" stroke="#426aa8"/><path d="M125 195 h38" stroke="#426aa8"/><path d="M177 195 h38" stroke="#426aa8"/><path d="M125 225 h38" stroke="#426aa8"/><path d="M177 225 h38" stroke="#426aa8"/><path d="M685 135 h38" stroke="#b96c2f"/><path d="M737 135 h38" stroke="#b96c2f"/><path d="M685 165 h38" stroke="#b96c2f"/><path d="M737 165 h38" stroke="#b96c2f"/><path d="M685 195 h38" stroke="#b96c2f"/><path d="M737 195 h38" stroke="#b96c2f"/><path d="M685 225 h38" stroke="#b96c2f"/><path d="M737 225 h38" stroke="#b96c2f"/></g><path d="M260 180 H350" stroke="#24324a" stroke-width="4" marker-end="url(#m)"/><path d="M640 180 H550" stroke="#24324a" stroke-width="4" marker-end="url(#m)"/><rect x="350" y="115" width="200" height="140" rx="60" fill="#eef7ee" stroke="#3f7b55" stroke-width="4"/><text x="450" y="155" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#2e5e40">Coinfected cell</text><text x="450" y="190" text-anchor="middle" font-family="Arial" font-size="16" fill="#172033">Both sets of 8 segments</text><text x="450" y="220" text-anchor="middle" font-family="Arial" font-size="16" fill="#172033">enter the same assembly pool</text><path d="M450 255 V320" stroke="#24324a" stroke-width="4" marker-end="url(#m)"/><circle cx="450" cy="400" r="95" fill="#f3ebff" stroke="#7651a8" stroke-width="4"/><text x="450" y="296" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#5b3888">Progeny virion</text><g stroke-width="8" stroke-linecap="round"><path d="M405 355 h38" stroke="#426aa8"/><path d="M457 355 h38" stroke="#b96c2f"/><path d="M405 385 h38" stroke="#b96c2f"/><path d="M457 385 h38" stroke="#426aa8"/><path d="M405 415 h38" stroke="#426aa8"/><path d="M457 415 h38" stroke="#b96c2f"/><path d="M405 445 h38" stroke="#b96c2f"/><path d="M457 445 h38" stroke="#426aa8"/></g><text x="450" y="505" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#172033">Abrupt exchange of intact segments = reassortment → antigenic shift</text></svg>