<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc"><title id="title">Aminoglycoside uptake requires respiratory membrane potential</title><desc id="desc">Original AylaMed schematic contrasting successful aminoglycoside uptake in a respiring bacterium with failed uptake in an anaerobic bacterium.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#24324a"/></marker></defs><rect width="900" height="520" rx="28" fill="#f7fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#172033">Aminoglycoside entry: target access depends on respiration</text><rect x="55" y="85" width="370" height="365" rx="24" fill="#e8f5ef" stroke="#2d7a62" stroke-width="3"/><text x="240" y="120" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#245a49">Respiring bacterium</text><rect x="105" y="170" width="270" height="180" rx="70" fill="#ffffff" stroke="#2d7a62" stroke-width="4"/><line x1="125" y1="205" x2="355" y2="205" stroke="#6b8798" stroke-width="5"/><line x1="125" y1="315" x2="355" y2="315" stroke="#6b8798" stroke-width="5"/><text x="240" y="196" text-anchor="middle" font-family="Arial" font-size="14" fill="#425466">Outer membrane</text><text x="240" y="339" text-anchor="middle" font-family="Arial" font-size="14" fill="#425466">Cytoplasmic membrane</text><circle cx="85" cy="260" r="16" fill="#f1b24a"/><text x="85" y="266" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700">AG</text><path d="M102 260 H175" stroke="#24324a" stroke-width="4" marker-end="url(#a)"/><path d="M180 285 C215 245 250 245 285 285" fill="none" stroke="#d65c5c" stroke-width="6"/><text x="235" y="245" text-anchor="middle" font-family="Arial" font-size="16" fill="#172033">Electron transport</text><text x="235" y="306" text-anchor="middle" font-family="Arial" font-size="15" fill="#172033">Δψ drives inner-membrane uptake</text><path d="M240 320 V380" stroke="#24324a" stroke-width="4" marker-end="url(#a)"/><ellipse cx="240" cy="405" rx="55" ry="26" fill="#dfe8ff" stroke="#4f6fb3" stroke-width="3"/><text x="240" y="411" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#29437d">30S target</text><text x="240" y="438" text-anchor="middle" font-family="Arial" font-size="15" fill="#245a49">Drug reaches ribosome</text><rect x="475" y="85" width="370" height="365" rx="24" fill="#fff0ef" stroke="#b54b4b" stroke-width="3"/><text x="660" y="120" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#8f3434">Obligate anaerobe</text><rect x="525" y="170" width="270" height="180" rx="70" fill="#ffffff" stroke="#b54b4b" stroke-width="4"/><line x1="545" y1="205" x2="775" y2="205" stroke="#6b8798" stroke-width="5"/><line x1="545" y1="315" x2="775" y2="315" stroke="#6b8798" stroke-width="5"/><circle cx="505" cy="260" r="16" fill="#f1b24a"/><text x="505" y="266" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700">AG</text><path d="M522 260 H590" stroke="#24324a" stroke-width="4" marker-end="url(#a)"/><line x1="615" y1="230" x2="705" y2="300" stroke="#b54b4b" stroke-width="8"/><line x1="705" y1="230" x2="615" y2="300" stroke="#b54b4b" stroke-width="8"/><text x="660" y="205" text-anchor="middle" font-family="Arial" font-size="15" fill="#172033">Insufficient respiratory Δψ</text><path d="M660 320 V370" stroke="#b54b4b" stroke-width="4" stroke-dasharray="8 7"/><ellipse cx="660" cy="405" rx="55" ry="26" fill="#dfe8ff" stroke="#4f6fb3" stroke-width="3"/><text x="660" y="411" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#29437d">30S intact</text><text x="660" y="438" text-anchor="middle" font-family="Arial" font-size="15" fill="#8f3434">Drug fails to reach target</text><text x="450" y="490" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#172033">Intrinsic resistance can result from failed transport, not altered ribosomal binding.</text></svg>