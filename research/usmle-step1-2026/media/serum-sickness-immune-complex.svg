<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
<title id="title">Serum sickness immune-complex timeline</title><desc id="desc">Foreign protein exposure is followed by antibody formation, circulating immune complexes, complement consumption, and deposition in vessels, joints, and glomeruli.</desc>
<rect width="960" height="520" fill="#ffffff"/>
<text x="40" y="45" font-family="Arial" font-size="28" font-weight="700">Systemic type III hypersensitivity</text>
<line x1="90" y1="135" x2="870" y2="135" stroke="#111827" stroke-width="5"/>
<circle cx="130" cy="135" r="16" fill="#2563eb"/><circle cx="370" cy="135" r="16" fill="#7c3aed"/><circle cx="620" cy="135" r="16" fill="#dc2626"/><circle cx="830" cy="135" r="16" fill="#d97706"/>
<text x="75" y="95" font-family="Arial" font-size="18">Day 0</text><text x="292" y="95" font-family="Arial" font-size="18">Days 6–10</text><text x="550" y="95" font-family="Arial" font-size="18">Complexes form</text><text x="775" y="95" font-family="Arial" font-size="18">Symptoms</text>
<text x="70" y="190" font-family="Arial" font-size="18">Foreign protein</text><text x="290" y="190" font-family="Arial" font-size="18">IgG/IgM produced</text><text x="535" y="190" font-family="Arial" font-size="18">Ag–Ab complexes</text><text x="750" y="190" font-family="Arial" font-size="18">Fever, rash, arthralgia</text>
<path d="M620 205 V270" stroke="#111827" stroke-width="5"/>
<rect x="475" y="270" width="290" height="70" rx="16" fill="#fee2e2" stroke="#991b1b" stroke-width="4"/>
<text x="520" y="300" font-family="Arial" font-size="19" font-weight="700">Classical complement activation</text><text x="548" y="327" font-family="Arial" font-size="18">C3 and C4 consumption</text>
<path d="M620 340 V390" stroke="#111827" stroke-width="5"/>
<g font-family="Arial" font-size="18"><rect x="125" y="390" width="190" height="75" rx="15" fill="#dbeafe" stroke="#1d4ed8" stroke-width="4"/><text x="175" y="433">Small vessels</text><rect x="385" y="390" width="190" height="75" rx="15" fill="#dcfce7" stroke="#166534" stroke-width="4"/><text x="445" y="433">Joints</text><rect x="645" y="390" width="190" height="75" rx="15" fill="#fef3c7" stroke="#92400e" stroke-width="4"/><text x="690" y="433">Glomeruli</text></g>
<path d="M620 370 C500 375 430 380 220 390" fill="none" stroke="#111827" stroke-width="4"/><path d="M620 370 C590 375 530 380 480 390" fill="none" stroke="#111827" stroke-width="4"/><path d="M620 370 C700 375 720 380 740 390" fill="none" stroke="#111827" stroke-width="4"/>
</svg>