<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Infantile hemangioma response to propranolol</title><desc id="desc">Early vascular effect followed by reduced angiogenic growth</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".13"/></filter></defs><rect width="1000" height="620" rx="28" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Infantile hemangioma response to propranolol</text><text x="500" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">Early vascular effect followed by reduced angiogenic growth</text><rect x="60" y="130" width="250" height="250" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/><text x="185.0" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Proliferative lesion</text><text x="185.0" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">rapid infant growth</text><text x="185.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">GLUT1-positive endothelium</text><text x="185.0" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">high vascular flow</text><rect x="375" y="130" width="250" height="250" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/><text x="500.0" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Beta blockade</text><text x="500.0" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">reduced cAMP signaling</text><text x="500.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">early vasoconstriction</text><text x="500.0" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">lower VEGF activity</text><rect x="690" y="130" width="250" height="250" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/><text x="815.0" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Clinical response</text><text x="815.0" y="192" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">pallor within days</text><text x="815.0" y="216" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">softening</text><text x="815.0" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">gradual involution</text><path d="M310 255 L375 255" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="342.5" y="247.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">propranolol</text><path d="M625 255 L690 255" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="657.5" y="247.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">response</text><text x="500" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Problematic infantile hemangiomas can regress rapidly after beta-adrenergic blockade.</text></svg>