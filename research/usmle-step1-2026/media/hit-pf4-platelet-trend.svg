<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Heparin-induced thrombocytopenia</title><desc id="d">Original schematic showing platelet factor 4 complexes, pathogenic IgG, Fc receptor activation, thrombosis, and the platelet-count fall after heparin exposure.</desc><rect width="900" height="520" rx="28" fill="#f8fafc"/><text x="450" y="40" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#0f172a">Heparin-induced thrombocytopenia</text><rect x="45" y="95" width="380" height="220" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="235" y="125" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">PF4–heparin immune complex</text><g fill="#f97316"><circle cx="135" cy="205" r="28"/><circle cx="190" cy="205" r="28"/><circle cx="245" cy="205" r="28"/></g><path d="M120 245 Q190 285 260 245" fill="none" stroke="#2563eb" stroke-width="10"/><path d="M305 170 q35 -35 70 0 l-35 35 z" fill="#fef3c7" stroke="#a16207" stroke-width="3"/><text x="340" y="235" text-anchor="middle" font-family="Arial" font-size="16">IgG</text><path d="M340 245 L340 290" stroke="#334155" stroke-width="4"/><rect x="520" y="105" width="320" height="190" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="680" y="140" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Platelet FcγRIIa activation</text><circle cx="620" cy="220" r="45" fill="#ef4444"/><circle cx="710" cy="210" r="40" fill="#f87171"/><path d="M425 205 L520 205" stroke="#334155" stroke-width="4" marker-end="url(#a)"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker></defs><text x="680" y="270" text-anchor="middle" font-family="Arial" font-size="16">platelet consumption + thrombin generation</text><path d="M75 430 H835 M110 350 V450" stroke="#64748b" stroke-width="3"/><polyline points="110,370 240,365 340,360 430,410 520,430 620,420 760,405" fill="none" stroke="#2563eb" stroke-width="6"/><line x1="330" y1="340" x2="330" y2="450" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 6"/><text x="330" y="330" text-anchor="middle" font-family="Arial" font-size="15" fill="#b91c1c">heparin</text><text x="470" y="485" text-anchor="middle" font-family="Arial" font-size="17">platelet count typically falls 5–10 days after exposure</text></svg>