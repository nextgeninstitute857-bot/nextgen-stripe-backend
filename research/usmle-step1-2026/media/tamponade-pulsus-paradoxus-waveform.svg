<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Respiratory variation in arterial pressure during cardiac tamponade</title><desc id="desc">Original arterial waveform showing lower systolic peaks during inspiration and recovery during expiration, consistent with pulsus paradoxus.</desc><rect width="800" height="500" fill="#fff"/><rect x="300" y="55" width="240" height="365" fill="#e8f3fb"/><text x="370" y="85" font-family="Arial" font-size="22">Inspiration</text><text x="105" y="85" font-family="Arial" font-size="22">Expiration</text><text x="610" y="85" font-family="Arial" font-size="22">Expiration</text><line x1="80" y1="420" x2="740" y2="420" stroke="#111" stroke-width="3"/><line x1="80" y1="420" x2="80" y2="65" stroke="#111" stroke-width="3"/><text x="330" y="470" font-family="Arial" font-size="20">Time</text><text x="28" y="290" font-family="Arial" font-size="20" transform="rotate(-90 28 290)">Arterial pressure</text><path d="M90 360 Q115 115 145 360 Q175 120 205 360 Q235 125 265 360 Q295 135 325 360 Q355 175 385 360 Q415 190 445 360 Q475 180 505 360 Q535 145 565 360 Q595 125 625 360 Q655 118 685 360 Q715 120 740 360" fill="none" stroke="#9a2f42" stroke-width="6"/><line x1="335" y1="120" x2="335" y2="185" stroke="#333" stroke-width="3"/><line x1="325" y1="120" x2="345" y2="120" stroke="#333" stroke-width="3"/><line x1="325" y1="185" x2="345" y2="185" stroke="#333" stroke-width="3"/><text x="350" y="150" font-family="Arial" font-size="18">Systolic fall &gt;10 mm Hg</text><text x="220" y="445" font-family="Arial" font-size="17">Fixed pericardial volume limits ventricular expansion</text></svg>