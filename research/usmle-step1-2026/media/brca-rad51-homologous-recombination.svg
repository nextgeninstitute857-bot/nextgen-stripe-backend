<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">BRCA-mediated homologous recombination</title><desc id="d">Original schematic of a DNA double-strand break, BRCA-dependent RAD51 loading, accurate sister-chromatid repair, and error-prone repair when the pathway is deficient.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#334155"/></marker></defs><rect width="900" height="520" rx="28" fill="#f8fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">BRCA1/2 and homologous recombination</text><rect x="45" y="120" width="220" height="270" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/><text x="155" y="155" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Double-strand break</text><line x1="95" y1="235" x2="140" y2="235" stroke="#2563eb" stroke-width="8"/><line x1="170" y1="235" x2="220" y2="235" stroke="#2563eb" stroke-width="8"/><line x1="95" y1="275" x2="135" y2="275" stroke="#7c3aed" stroke-width="8"/><line x1="175" y1="275" x2="220" y2="275" stroke="#7c3aed" stroke-width="8"/><path d="M265 255 L345 255" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><rect x="345" y="95" width="230" height="320" rx="20" fill="#ecfdf5" stroke="#16a34a" stroke-width="3"/><text x="460" y="135" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">BRCA pathway intact</text><rect x="390" y="175" width="140" height="50" rx="14" fill="#22c55e"/><text x="460" y="206" text-anchor="middle" font-family="Arial" font-size="17">RAD51 loading</text><path d="M405 280 q55-55 110 0" fill="none" stroke="#2563eb" stroke-width="8"/><path d="M405 320 q55-55 110 0" fill="none" stroke="#7c3aed" stroke-width="8"/><text x="460" y="375" text-anchor="middle" font-family="Arial" font-size="16">high-fidelity repair using sister chromatid</text><path d="M575 255 L650 255" stroke="#334155" stroke-width="5" marker-end="url(#a)"/><rect x="650" y="120" width="205" height="270" rx="20" fill="#fff1f2" stroke="#e11d48" stroke-width="3"/><text x="752" y="155" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">BRCA loss</text><polyline points="685,260 720,220 750,290 785,210 825,285" fill="none" stroke="#e11d48" stroke-width="7"/><text x="752" y="335" text-anchor="middle" font-family="Arial" font-size="16">genomic instability</text><text x="752" y="365" text-anchor="middle" font-family="Arial" font-size="16">error-prone end joining</text></svg>