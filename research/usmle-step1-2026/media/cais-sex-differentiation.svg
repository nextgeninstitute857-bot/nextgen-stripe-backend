<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
<title id="title">Complete androgen insensitivity: fetal pathways</title><desc id="desc">Fetal pathway showing intact AMH but failed androgen receptor signaling in complete androgen insensitivity.</desc>
<rect width="1000" height="620" fill="#ffffff"/><rect x="20" y="20" width="960" height="580" rx="20" fill="#f8fafc" stroke="#334155" stroke-width="2"/>
<text x="50" y="65" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0f172a">Complete androgen insensitivity: fetal pathways</text>
<rect x="385" y="100" width="230" height="80" rx="18" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/><text x="438" y="150" font-family="Arial" font-size="25" font-weight="700">46,XY testes</text>
<line x1="500" y1="180" x2="275" y2="265" stroke="#0f172a" stroke-width="4"/><line x1="500" y1="180" x2="725" y2="265" stroke="#0f172a" stroke-width="4"/>
<rect x="95" y="265" width="330" height="95" rx="16" fill="#dcfce7" stroke="#15803d" stroke-width="2"/><text x="135" y="310" font-family="Arial" font-size="23" font-weight="700">Sertoli cells: AMH intact</text><text x="135" y="340" font-family="Arial" font-size="19">Müllerian ducts regress</text>
<rect x="575" y="265" width="330" height="95" rx="16" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/><text x="620" y="310" font-family="Arial" font-size="23" font-weight="700">Leydig cells: testosterone</text><text x="610" y="340" font-family="Arial" font-size="19">Androgen receptor nonfunctional</text>
<line x1="260" y1="360" x2="260" y2="455" stroke="#15803d" stroke-width="5"/><polygon points="250,445 270,445 260,465" fill="#15803d"/><text x="130" y="505" font-family="Arial" font-size="22">No uterus / cervix / upper vagina</text>
<line x1="740" y1="360" x2="740" y2="455" stroke="#b91c1c" stroke-width="5"/><polygon points="730,445 750,445 740,465" fill="#b91c1c"/><text x="590" y="505" font-family="Arial" font-size="22">Female external phenotype</text><text x="635" y="535" font-family="Arial" font-size="18">Sparse pubic hair</text>
<text x="50" y="585" font-family="Arial,sans-serif" font-size="16" fill="#475569">AylaMed original teaching graphic — private research draft</text>
</svg>