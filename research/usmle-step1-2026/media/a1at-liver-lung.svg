<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Alpha-1 antitrypsin deficiency</title><desc id="desc">One mutation causes toxic liver retention and loss of lung protection</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".13"/></filter></defs><rect width="1000" height="620" rx="28" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Alpha-1 antitrypsin deficiency</text><text x="500" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">One mutation causes toxic liver retention and loss of lung protection</text><rect x="45" y="120" width="290" height="300" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/><text x="190.0" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Hepatocyte ER</text><text x="190.0" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">Z protein misfolds</text><text x="190.0" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">polymers retained</text><text x="190.0" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">PAS-positive globules</text><rect x="355" y="120" width="290" height="300" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/><text x="500.0" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Low serum A1AT</text><text x="500.0" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">reduced secretion</text><text x="500.0" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">protease-antiprotease imbalance</text><rect x="665" y="120" width="290" height="300" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/><text x="810.0" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Lung acinus</text><text x="810.0" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">neutrophil elastase active</text><text x="810.0" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">basal panacinar emphysema</text><path d="M335 270 L355 270" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="345.0" y="262.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">less secretion</text><path d="M645 270 L665 270" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="655.0" y="262.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">permits</text><text x="500" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Liver disease is gain of toxic retention; lung disease is loss of antiprotease function.</text></svg>