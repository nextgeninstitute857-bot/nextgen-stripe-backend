<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Multiple myeloma SPEP and cast nephropathy</title><desc id="d">Original schematic combining a monoclonal serum-protein spike with filtered light chains binding Tamm-Horsfall protein and forming obstructive tubular casts.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 z" fill="#334155"/></marker></defs><rect width="900" height="520" rx="28" fill="#f8fafc"/><text x="450" y="42" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Multiple myeloma: monoclonal protein and kidney injury</text><rect x="45" y="95" width="360" height="330" rx="20" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="225" y="130" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Serum protein electrophoresis</text><line x1="85" y1="365" x2="365" y2="365" stroke="#64748b" stroke-width="3"/><polyline points="90,350 130,320 170,340 215,335 255,330 285,335 315,115 330,345 360,350" fill="none" stroke="#7c3aed" stroke-width="6"/><text x="315" y="105" text-anchor="middle" font-family="Arial" font-size="17" fill="#6d28d9">M spike</text><rect x="485" y="95" width="370" height="330" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/><text x="670" y="130" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700">Distal nephron</text><path d="M545 175 C600 150 635 190 620 240 C605 290 650 315 720 290 C790 265 815 315 785 365" fill="none" stroke="#0284c7" stroke-width="35" stroke-linecap="round"/><g fill="#f59e0b"><circle cx="570" cy="180" r="9"/><circle cx="600" cy="195" r="9"/><circle cx="640" cy="270" r="9"/><circle cx="690" cy="290" r="9"/></g><path d="M645 245 q45-40 90 0 q-45 45-90 0z" fill="#7f1d1d" stroke="#450a0a" stroke-width="3"/><text x="690" y="225" text-anchor="middle" font-family="Arial" font-size="15">light-chain cast</text><text x="670" y="390" text-anchor="middle" font-family="Arial" font-size="16">light chains + Tamm-Horsfall protein → obstruction and inflammation</text><path d="M405 255 L485 255" stroke="#334155" stroke-width="5" marker-end="url(#a)"/></svg>