<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Effect of bedside maneuvers on hypertrophic obstructive cardiomyopathy murmur intensity</title><desc id="desc">Original bar chart showing greater murmur intensity with standing and Valsalva and lower intensity with squatting and handgrip.</desc><rect width="800" height="500" fill="#fff"/><line x1="90" y1="410" x2="735" y2="410" stroke="#111" stroke-width="3"/><line x1="90" y1="410" x2="90" y2="70" stroke="#111" stroke-width="3"/><text x="22" y="300" font-family="Arial" font-size="20" transform="rotate(-90 22 300)">Relative murmur intensity</text><rect x="135" y="175" width="95" height="235" fill="#8c3d65"/><rect x="285" y="120" width="95" height="290" fill="#8c3d65"/><rect x="435" y="285" width="95" height="125" fill="#4f7f9d"/><rect x="585" y="315" width="95" height="95" fill="#4f7f9d"/><text x="145" y="445" font-family="Arial" font-size="18">Standing</text><text x="295" y="445" font-family="Arial" font-size="18">Valsalva</text><text x="445" y="445" font-family="Arial" font-size="18">Squatting</text><text x="595" y="445" font-family="Arial" font-size="18">Handgrip</text><text x="155" y="160" font-family="Arial" font-size="18">↓ preload</text><text x="295" y="105" font-family="Arial" font-size="18">↓ preload</text><text x="435" y="270" font-family="Arial" font-size="18">↑ preload</text><text x="585" y="300" font-family="Arial" font-size="18">↑ afterload</text><text x="190" y="55" font-family="Arial" font-size="22">Smaller LV cavity increases dynamic outflow obstruction</text></svg>