<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">UIP pattern in idiopathic pulmonary fibrosis</title><desc id="desc">Basal subpleural remodeling with temporally heterogeneous fibrosis</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".13"/></filter></defs><rect width="1000" height="620" rx="28" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">UIP pattern in idiopathic pulmonary fibrosis</text><text x="500" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">Basal subpleural remodeling with temporally heterogeneous fibrosis</text><rect x="55" y="120" width="270" height="270" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/><text x="190.0" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">High-resolution CT</text><text x="190.0" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">basal subpleural reticulation</text><text x="190.0" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">traction bronchiectasis</text><text x="190.0" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">honeycomb cysts</text><rect x="365" y="120" width="270" height="270" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/><text x="500.0" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Histology</text><text x="500.0" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">patchy dense scar</text><text x="500.0" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">adjacent normal lung</text><text x="500.0" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">fibroblastic foci</text><rect x="675" y="120" width="270" height="270" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/><text x="810.0" y="152" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Profibrotic signaling</text><text x="810.0" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">epithelial injury</text><text x="810.0" y="206" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">TGF-beta activation</text><text x="810.0" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">myofibroblast collagen</text><path d="M325 255 L365 255" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="345.0" y="247.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">correlation</text><path d="M635 255 L675 255" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="655.0" y="247.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">drives</text><text x="500" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">UIP combines characteristic distribution, architectural distortion, and fibroblastic foci.</text></svg>