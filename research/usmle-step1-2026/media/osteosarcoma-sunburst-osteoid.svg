<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">Osteosarcoma</title><desc id="desc">Aggressive metaphyseal bone formation by malignant cells</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".13"/></filter></defs><rect width="1000" height="620" rx="28" fill="#f8fafc"/><text x="500" y="45" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Osteosarcoma</text><text x="500" y="73" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#475569">Aggressive metaphyseal bone formation by malignant cells</text><rect x="55" y="125" width="270" height="285" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/><text x="190.0" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Radiograph</text><text x="190.0" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">metaphyseal lesion</text><text x="190.0" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">sunburst spicules</text><text x="190.0" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">Codman triangle</text><rect x="365" y="125" width="270" height="285" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/><text x="500.0" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Histology</text><text x="500.0" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">pleomorphic tumor cells</text><text x="500.0" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">irregular eosinophilic matrix</text><rect x="675" y="125" width="270" height="285" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/><text x="810.0" y="157" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#0f172a">Diagnostic criterion</text><text x="810.0" y="187" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">malignant cells directly</text><text x="810.0" y="211" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#334155">produce osteoid</text><path d="M325 265 L365 265" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="345.0" y="257.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">biopsy</text><path d="M635 265 L675 265" stroke="#334155" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="655.0" y="257.0" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#334155">defines tumor</text><text x="500" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#334155">Malignant osteoid production establishes osteosarcoma.</text></svg>