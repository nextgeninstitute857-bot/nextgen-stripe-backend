<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Mitochondrial heteroplasmy and threshold effect</title><desc id="d">Original AylaMed diagram showing uneven segregation of normal and mutant mitochondria into daughter cells and disease after a tissue-specific mutant-load threshold is exceeded.</desc><defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3 Z" fill="#24324a"/></marker></defs><rect width="900" height="520" rx="28" fill="#f7fafc"/><text x="450" y="44" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#172033">Heteroplasmy + random segregation + tissue threshold</text><rect x="45" y="85" width="310" height="330" rx="22" fill="#ffffff" stroke="#c7d2df" stroke-width="2"/><text x="200" y="120" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Maternal cell</text><circle cx="200" cy="250" r="112" fill="#f3f6fa" stroke="#6b8798" stroke-width="3"/><g><circle cx="145" cy="195" r="14" fill="#2d7a62"/><circle cx="190" cy="185" r="14" fill="#b65454"/><circle cx="238" cy="195" r="14" fill="#2d7a62"/><circle cx="270" cy="235" r="14" fill="#b65454"/><circle cx="245" cy="285" r="14" fill="#b65454"/><circle cx="195" cy="310" r="14" fill="#2d7a62"/><circle cx="145" cy="285" r="14" fill="#2d7a62"/><circle cx="125" cy="240" r="14" fill="#b65454"/></g><text x="200" y="390" text-anchor="middle" font-family="Arial" font-size="16" fill="#425466">Mixed normal and mutant mtDNA</text><path d="M355 220 H425" stroke="#24324a" stroke-width="4" marker-end="url(#m)"/><path d="M355 280 H425" stroke="#24324a" stroke-width="4" marker-end="url(#m)"/><text x="390" y="195" text-anchor="middle" font-family="Arial" font-size="15" fill="#172033">random</text><text x="390" y="315" text-anchor="middle" font-family="Arial" font-size="15" fill="#172033">segregation</text><rect x="440" y="85" width="415" height="330" rx="22" fill="#ffffff" stroke="#c7d2df" stroke-width="2"/><text x="648" y="120" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#172033">Different daughter cells / tissues</text><circle cx="545" cy="235" r="75" fill="#e8f5ef" stroke="#2d7a62" stroke-width="3"/><circle cx="750" cy="235" r="75" fill="#fff0ef" stroke="#b65454" stroke-width="3"/><g><circle cx="515" cy="210" r="11" fill="#2d7a62"/><circle cx="545" cy="195" r="11" fill="#2d7a62"/><circle cx="575" cy="210" r="11" fill="#2d7a62"/><circle cx="515" cy="250" r="11" fill="#2d7a62"/><circle cx="545" cy="270" r="11" fill="#b65454"/><circle cx="575" cy="250" r="11" fill="#2d7a62"/><circle cx="720" cy="210" r="11" fill="#b65454"/><circle cx="750" cy="195" r="11" fill="#b65454"/><circle cx="780" cy="210" r="11" fill="#2d7a62"/><circle cx="720" cy="250" r="11" fill="#b65454"/><circle cx="750" cy="270" r="11" fill="#b65454"/><circle cx="780" cy="250" r="11" fill="#b65454"/></g><text x="545" y="335" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#245a49">Below threshold</text><text x="545" y="360" text-anchor="middle" font-family="Arial" font-size="15" fill="#425466">adequate respiratory reserve</text><text x="750" y="335" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#8f3434">Above threshold</text><text x="750" y="360" text-anchor="middle" font-family="Arial" font-size="15" fill="#425466">bioenergetic dysfunction</text><circle cx="305" cy="466" r="11" fill="#2d7a62"/><text x="325" y="472" font-family="Arial" font-size="16" fill="#172033">normal mtDNA</text><circle cx="495" cy="466" r="11" fill="#b65454"/><text x="515" y="472" font-family="Arial" font-size="16" fill="#172033">pathogenic mtDNA</text><text x="450" y="505" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#172033">Mutant load can differ among siblings and among organs in the same person.</text></svg>