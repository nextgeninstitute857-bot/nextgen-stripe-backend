<rect x="55" y="105" width="440" height="420" rx="16" fill="#fdf2f8" stroke="#be185d" stroke-width="2"/><text x="90" y="145" font-family="Arial" font-size="23" font-weight="700">Tubal anatomy</text>
<path d="M250 420 C180 370 175 250 250 215 C325 250 320 370 250 420" fill="#fbcfe8" stroke="#be185d" stroke-width="4"/><path d="M235 220 C165 180 105 190 75 225" fill="none" stroke="#be185d" stroke-width="16" stroke-linecap="round"/><path d="M265 220 C335 180 395 190 465 225" fill="none" stroke="#be185d" stroke-width="16" stroke-linecap="round"/>
